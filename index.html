<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congresso de Comissões</title>
    <style>
        :root {
            --pri: #1e3a5f; --accent: #2b6cb0; --ok: #276749; --ok-bg: #c6f6d5;
            --nok: #c53030; --nok-bg: #fed7d7; --warn: #b7791f; --warn-bg: #fefcbf;
            --bg: #f0f4f8; --card: #fff; --brd: #d2d6dc; --txt: #1a202c; --txt2: #718096;
            --hdr: 48px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; overflow:hidden; }
        button { cursor:pointer; font-family:inherit; font-size:inherit; }
        input,textarea { font-family:inherit; font-size:inherit; }

        /* HEADER */
        .hdr { display:flex; align-items:center; height:var(--hdr); padding:0 8px; background:var(--pri); color:#fff; flex-shrink:0; gap:8px; }
        .hdr h1 { font-size:14px; font-weight:600; white-space:nowrap; }
        .timer { display:flex; align-items:center; gap:4px; margin-left:auto; }
        #tm { font-family:Consolas,"Courier New",monospace; font-size:20px; font-weight:700; }
        .timer button, .hdr-btn { background:rgba(255,255,255,.15); border:none; color:#fff; min-width:32px; height:32px; border-radius:4px; font-size:13px; padding:0 8px; }
        .timer button:hover, .hdr-btn:hover { background:rgba(255,255,255,.3); }
        .timer button:disabled { opacity:.35; }
        .tm-w { color:#fbd38d!important; }
        .tm-d { color:#feb2b2!important; }

        /* APP */
        .app { display:flex; flex:1; overflow:hidden; }

        /* SIDEBAR */
        .side { width:100%; max-width:400px; border-right:1px solid var(--brd); display:flex; flex-direction:column; background:#fff; flex-shrink:0; }
        .tabs { display:flex; border-bottom:1px solid var(--brd); }
        .tabs button { flex:1; padding:8px; border:none; background:none; font-size:13px; font-weight:600; color:var(--txt2); border-bottom:2px solid transparent; }
        .tabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
        .tbar { padding:6px 8px; border-bottom:1px solid var(--brd); display:flex; flex-wrap:wrap; gap:4px; }
        .tbar button { background:var(--bg); border:1px solid var(--brd); padding:6px 10px; border-radius:4px; font-size:12px; color:var(--txt); }
        .tbar button:hover { background:#e2e8f0; }
        .tbar input { flex:1; min-width:80px; padding:6px 8px; border:1px solid var(--brd); border-radius:4px; font-size:13px; }
        .stats { padding:3px 8px; font-size:11px; color:var(--txt2); background:#f7fafc; border-bottom:1px solid var(--brd); }
        .tcont { display:none; flex-direction:column; flex:1; overflow:hidden; }
        .tcont.on { display:flex; }
        .lst { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

        /* SIDEBAR SPLIT + NOTAS */
        .side-top { flex:4; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
        .side-notes { flex:1; display:flex; flex-direction:column; min-height:0; border-top:2px solid var(--brd); background:#f7fafc; }
        .side-notes label { font-size:11px; font-weight:600; color:var(--txt2); text-transform:uppercase; padding:5px 8px 2px; flex-shrink:0; }
        .side-notes textarea { flex:1; width:100%; border:none; resize:none; padding:4px 8px 8px; font-size:13px; background:transparent; outline:none; font-family:inherit; line-height:1.4; }

        /* ENTRIES */
        .ent { display:flex; align-items:center; padding:8px; border-bottom:1px solid #edf2f7; cursor:pointer; font-size:13px; gap:6px; min-height:44px; }
        .ent:active { background:#ebf4ff; }
        .ent.sel { box-shadow:inset -5px 0 0 var(--accent); }
        .ent.pres { background:#1a202c; color:#fff; font-weight:600; font-size:12px; }
        .ent.pres .et { text-align:center; }
        .ent.pres .drag-handle { color:#4a5568; }
        .ent.pres .drag-handle:hover { color:#a0aec0; }
        .ent.pres .bi { color:#cbd5e0; }
        .ent.pres .bi:hover { background:rgba(255,255,255,.15); color:#fff; }
        .ent.pres.sel { box-shadow:inset -5px 0 0 #f6ad55; }
        .ent.nvotavel { background:#f1f5f9; color:#8899a8; }
        .ent.sem-com { background:#f1f5f9; color:#8899a8; }
        .badge-res { font-size:14px; font-weight:700; flex-shrink:0; line-height:1; }
        .badge-res.ok { color:var(--ok); }
        .badge-res.no { color:var(--nok); }
        .badge-res.pe { color:var(--warn); }
        .ent .chk { flex-shrink:0; width:18px; height:18px; }
        .ent .et { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .badge-pe { background:#fbd38d; color:#744210; font-size:10px; padding:1px 5px; border-radius:3px; font-weight:600; flex-shrink:0; }
        .badge-c { font-size:10px; color:var(--txt2); flex-shrink:0; }
        .bi { background:none; border:none; padding:4px; font-size:14px; border-radius:4px; color:var(--txt2); min-width:28px; min-height:28px; }
        .bi:hover { background:#e2e8f0; }
        .bi.rm:hover { background:var(--nok-bg); color:var(--nok); }

        /* DRAG AND DROP */
        .drag-handle { cursor:grab; padding:4px 2px; font-size:15px; color:var(--brd); user-select:none; touch-action:none; flex-shrink:0; line-height:1; }
        .drag-handle:hover { color:var(--txt2); }
        .ent.dragging { opacity:0.2; }
        .drag-line { height:2px; background:var(--accent); border-radius:1px; pointer-events:none; }

        /* MAIN */
        .main { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; display:none; transition:background .25s; }
        .main.on { display:block; }
        .main.st-ok { background:#e9fbf0; }
        .main.st-no { background:#fdecec; }
        .main.st-pe { background:#fdfae3; }
        .ph { color:var(--txt2); text-align:center; margin-top:60px; font-size:14px; }
        .det h2 { font-size:17px; margin-bottom:10px; }
        .det h3 { font-size:13px; margin:14px 0 6px; color:var(--pri); text-transform:uppercase; }
        .hint { font-size:12px; color:var(--txt2); margin-bottom:8px; }
        .imeta { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
        .imeta label { display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; }
        .fg { margin-bottom:10px; }
        .fg label { display:block; font-size:11px; font-weight:600; margin-bottom:2px; color:var(--txt2); text-transform:uppercase; }
        .fg input, .fg textarea { width:100%; padding:6px 8px; border:1px solid var(--brd); border-radius:4px; font-size:13px; }
        .fg textarea { resize:vertical; }

        /* COMISSAO CARDS */
        .cc { border:1px solid var(--brd); border-radius:6px; margin-bottom:6px; overflow:hidden; transition:border-color .2s; }
        .cc.off { opacity:.5; }
        .cc.st-ok { border-color:var(--ok); background:#e9fbf0; }
        .cc.st-ok .cch { background:var(--ok-bg); }
        .cc.st-no { border-color:var(--nok); background:#fdecec; }
        .cc.st-no .cch { background:var(--nok-bg); }
        .cc.st-pe { border-color:var(--warn); background:#fdfae3; }
        .cc.st-pe .cch { background:var(--warn-bg); }
        .cch { display:flex; align-items:center; gap:6px; padding:8px; background:#f7fafc; font-size:13px; cursor:pointer; }
        .cch label { display:flex; align-items:center; gap:5px; cursor:pointer; flex:1; font-weight:600; }
        .cch .cnm { font-weight:400; font-size:11px; color:var(--txt2); }
        .ccb { padding:8px; display:none; }
        .cc.ativo .ccb { display:block; }
        .qb { display:inline-block; font-size:10px; padding:1px 6px; border-radius:8px; font-weight:600; white-space:nowrap; }
        .qok { background:var(--ok-bg); color:var(--ok); }
        .qno { background:var(--nok-bg); color:var(--nok); }

        /* MEMBER VOTES */
        .mv { display:flex; flex-wrap:wrap; gap:3px; }
        .mr { display:flex; align-items:center; gap:4px; padding:3px 6px; border-radius:4px; font-size:12px; background:#f7fafc; border:1px solid #edf2f7; min-height:32px; }
        .mr.ausente { opacity:.35; }
        .mr .vb { min-width:28px; height:24px; border:1px solid var(--brd); border-radius:3px; font-size:10px; font-weight:700; background:#fff; }
        .mr .vb.sim { background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
        .mr .vb.nao { background:var(--nok-bg); color:var(--nok); border-color:var(--nok); }
        .mr .vb.abst { background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }
        .mr .vb.nada { background:#fff; color:var(--txt2); border-color:var(--brd); }

        /* PRESENCE DETAIL */
        .pc { border:1px solid var(--brd); border-radius:6px; margin-bottom:8px; overflow:hidden; transition:border-color .2s; }
        .pc.st-ok { border-color:var(--ok); background:#e9fbf0; }
        .pc.st-ok .pch { background:var(--ok-bg); }
        .pc.st-no { border-color:var(--nok); background:#fdecec; }
        .pc.st-no .pch { background:var(--nok-bg); }
        .pch { display:flex; justify-content:space-between; align-items:center; padding:8px; background:#f7fafc; font-size:13px; font-weight:600; }
        .pcb { padding:8px; }
        .mg { display:flex; flex-wrap:wrap; gap:3px; }
        .mc { display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; padding:4px 6px; border-radius:4px; background:#f7fafc; border:1px solid #edf2f7; min-height:36px; }
        .mc input { width:17px; height:17px; }
        .mc.herd { background:#e6effb; border-color:#a9c7ec; }
        .mc.nova { background:var(--ok-bg); border-color:var(--ok); }
        .lg-herd { color:#3a6ea5; font-weight:600; }
        .lg-nova { color:var(--ok); font-weight:600; }
        .pa { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
        .pa button { padding:6px 10px; border:1px solid var(--brd); border-radius:4px; font-size:12px; background:#fff; min-height:36px; }

        /* NAV BUTTONS */
        .nav-bar { display:flex; gap:6px; margin-bottom:12px; }
        .nav-btn { flex:1; display:flex; align-items:center; gap:6px; padding:10px 14px; border:1px solid var(--brd); border-radius:6px; background:#fff; font-size:13px; color:var(--txt); min-height:48px; transition:background .15s; }
        .nav-btn:hover:not(:disabled) { background:#ebf4ff; border-color:var(--accent); }
        .nav-btn:disabled { opacity:.3; cursor:default; }
        .nav-btn .nav-arrow { font-size:20px; font-weight:700; color:var(--accent); flex-shrink:0; }
        .nav-btn .nav-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .nav-btn.next { justify-content:flex-end; text-align:right; }

        /* RESULT */
        .res { border:1px solid var(--brd); border-radius:6px; padding:10px; margin-top:10px; }
        .res h3 { margin-top:0; }
        .rs { font-size:14px; font-weight:700; margin-top:4px; }
        .rs.ok { color:var(--ok); }
        .rs.no { color:var(--nok); }
        .rs.pe { color:var(--warn); }

        /* VOTAÇÃO SIMBÓLICA */
        .sv { border:1px solid var(--brd); border-radius:6px; padding:10px; margin-bottom:14px; background:#fff; }
        .sv h3 { margin:0 0 8px; }
        .sv-hint { font-weight:400; font-size:10px; color:var(--txt2); text-transform:none; }
        .sv-bar { position:relative; display:flex; gap:6px; align-items:stretch; }
        .sv-input { flex:1; padding:10px 12px; border:1px solid var(--brd); border-radius:6px; font-size:15px; }
        .sv-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(43,108,176,.2); }
        .sv-mode { display:flex; align-items:center; gap:5px; padding:0 12px; border:1px solid transparent; border-radius:6px; font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer; user-select:none; }
        .sv-mode:hover { filter:brightness(.96); }
        .sv-mode:active { filter:brightness(.9); }
        .sv-mode.fav { background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
        .sv-mode.contra { background:var(--nok-bg); color:var(--nok); border-color:var(--nok); }
        .sv-mode.abst { background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }
        .sv-mode .sv-caret { font-size:9px; opacity:.7; }
        .sv-sug { display:none; position:absolute; top:100%; left:0; right:0; margin-top:4px; background:#fff; border:1px solid var(--brd); border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.12); z-index:20; max-height:320px; overflow-y:auto; }
        .sv-sug.show { display:block; }
        .sv-sug-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; font-size:14px; cursor:pointer; border-bottom:1px solid #edf2f7; }
        .sv-sug-item:last-child { border-bottom:none; }
        .sv-sug-item.incom { background:#e6f7e6; }
        .sv-sug-item.active { background:#cbe7ff; }
        .sv-sug-item.incom.active { background:#7fd093; }
        .sv-sug-tag { font-size:10px; color:var(--txt2); background:rgba(0,0,0,.06); padding:1px 6px; border-radius:8px; white-space:nowrap; flex-shrink:0; }
        .sv-keys { font-size:11px; color:var(--txt2); margin:6px 0 0; }
        .sv-list { margin-top:10px; display:flex; flex-direction:column; gap:4px; }
        .sv-li { display:flex; align-items:center; gap:8px; padding:5px 8px; background:#f7fafc; border:1px solid #edf2f7; border-radius:4px; font-size:13px; }
        .sv-seq { min-width:20px; text-align:center; font-weight:700; color:var(--txt2); font-size:11px; flex-shrink:0; }
        .sv-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; white-space:nowrap; flex-shrink:0; }
        .sv-badge.fav { background:var(--ok-bg); color:var(--ok); }
        .sv-badge.contra { background:var(--nok-bg); color:var(--nok); }
        .sv-badge.abst { background:var(--warn-bg); color:var(--warn); }
        .sv-nome { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .sv-fora { font-size:10px; color:var(--warn); font-weight:600; }
        .sv-dig { font-size:11px; color:var(--txt2); font-style:italic; flex-shrink:0; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .sv-rm { background:none; border:none; color:var(--txt2); padding:2px 6px; border-radius:4px; font-size:13px; flex-shrink:0; }
        .sv-rm:hover { background:var(--nok-bg); color:var(--nok); }
        .sv-empty { font-size:12px; color:var(--txt2); margin:8px 0 0; }

        /* MODAL */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; justify-content:center; align-items:flex-start; padding:20px; overflow-y:auto; }
        .modal.show { display:flex; }
        .mcard { background:#fff; border-radius:8px; width:600px; max-width:100%; max-height:90vh; display:flex; flex-direction:column; }
        .mhdr { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid var(--brd); }
        .mhdr h2 { font-size:15px; }
        .mbody { flex:1; overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch; }
        .mftr { padding:10px 12px; border-top:1px solid var(--brd); display:flex; justify-content:flex-end; gap:6px; }
        .mftr button { padding:6px 14px; border:1px solid var(--brd); border-radius:4px; font-size:13px; background:#fff; }
        .mftr button.pri { background:var(--accent); color:#fff; border-color:var(--accent); }
        .cfgc { margin-bottom:14px; }
        .cfgc h4 { font-size:12px; margin-bottom:4px; color:var(--pri); }
        .cfgm { display:flex; gap:4px; margin-bottom:3px; }
        .cfgm input { flex:1; padding:4px 6px; border:1px solid var(--brd); border-radius:4px; font-size:13px; }
        .addm { font-size:12px; color:var(--accent); background:none; border:none; padding:3px 0; }

        /* IMPORTAR/EXPORTAR TEXTO */
        .cfg-txt { margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--brd); }
        .cfg-txt summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--pri); padding:4px 0; user-select:none; }
        .cfg-txt textarea { width:100%; min-height:200px; padding:8px; border:1px solid var(--brd); border-radius:4px; font-size:12px; font-family:Consolas,"Courier New",monospace; resize:vertical; margin-top:6px; line-height:1.5; }
        .cfg-txt .hint { font-size:11px; color:var(--txt2); margin-top:4px; }
        .cfg-txt .btn-row { display:flex; gap:6px; margin-top:6px; }
        .cfg-txt .btn-row button { padding:5px 12px; border:1px solid var(--brd); border-radius:4px; font-size:12px; background:#fff; }
        .cfg-txt .btn-row button.pri { background:var(--accent); color:#fff; border-color:var(--accent); }
        .cfg-txt .btn-row button.pri:hover { background:#2558a0; }
        .cfg-txt .msg { font-size:12px; margin-top:4px; padding:4px 8px; border-radius:4px; display:none; }
        .cfg-txt .msg.ok { display:block; background:var(--ok-bg); color:var(--ok); }
        .cfg-txt .msg.err { display:block; background:var(--nok-bg); color:var(--nok); }

        /* HAMBURGER */
        .btn-menu { display:none; background:rgba(255,255,255,.15); border:none; color:#fff; width:32px; height:32px; border-radius:4px; font-size:18px; line-height:1; }
        .btn-menu:hover { background:rgba(255,255,255,.3); }

        /* BACKDROP */
        .side-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:49; }

        /* DESKTOP */
        @media(min-width:700px) {
            .side { width:380px; }
            .main { display:block!important; }
            .ent { min-height:34px; padding:5px 8px; }
        }
        /* MOBILE */
        @media(max-width:699px) {
            .hdr h1 { display:none; }
            .btn-menu { display:inline-block; }
            .main { display:block!important; }
            .side {
                position:fixed; top:var(--hdr); left:0; bottom:0; z-index:50;
                max-width:85vw; width:380px;
                transform:translateX(-100%); transition:transform .25s ease;
                box-shadow:2px 0 12px rgba(0,0,0,.15);
            }
            .app.side-open .side { transform:translateX(0); }
            .app.side-open .side-backdrop { display:block; }
        }
    </style>
</head>
<body>

<header class="hdr">
    <button class="btn-menu" id="bt-menu" title="Menu">&#9776;</button>
    <h1>Congresso</h1>
    <div class="timer">
        <span id="tm">75:00</span>
        <button id="bt-play" title="Iniciar">&#9654;</button>
        <button id="bt-pause" title="Pausar" disabled>&#10074;&#10074;</button>
        <button id="bt-reset" title="Reiniciar">&#8634;</button>
    </div>
    <button class="hdr-btn" id="bt-cfg">&#9881;</button>
    <button class="hdr-btn" id="bt-novo">Novo</button>
</header>

<div class="app" id="app">
    <div class="side-backdrop" id="side-backdrop"></div>
    <aside class="side">
        <div class="side-top">
            <div class="tabs">
                <button class="on" data-tab="cong">Congresso</button>
                <button data-tab="itens">Itens</button>
            </div>
            <div id="t-cong" class="tcont on">
                <div class="tbar">
                    <button id="bt-pres">+ Presença</button>
                    <button id="bt-pe">+ Pé de Pauta</button>
                </div>
                <div id="st-cong" class="stats"></div>
                <div id="l-cong" class="lst"></div>
            </div>
            <div id="t-itens" class="tcont">
                <div class="tbar">
                    <input type="text" id="busca" placeholder="Buscar...">
                </div>
                <div id="st-itens" class="stats"></div>
                <div id="l-itens" class="lst"></div>
            </div>
        </div>
        <div class="side-notes">
            <label for="anotacoes">Anotações</label>
            <textarea id="anotacoes" spellcheck="false" placeholder="Anotações livres sobre o Congresso…"></textarea>
        </div>
    </aside>
    <main class="main" id="main">
        <div id="det"></div>
    </main>
</div>

<div id="modal" class="modal">
    <div class="mcard">
        <div class="mhdr"><h2>Configuração</h2><button class="bi" onclick="fecharCfg()">&#10005;</button></div>
        <div class="mbody" id="cfgbody"></div>
        <div class="mftr">
            <button onclick="resetCom()">Restaurar padrão</button>
            <button class="pri" onclick="fecharCfg()">Fechar</button>
        </div>
    </div>
</div>

<script>
// ========== COMISSÕES DEFAULT ==========
const COM_DEF = [
    { sigla:'CCJ', nome:'Constituição, Justiça e Legislação Participativa',
      membros:['Dr. Milton Ferreira (PODE)','Janaína Paschoal (PP)','Lucas Pavanato (PL)','Luna Zarattini (PT)','Sandra Santana (MDB)','Sansão Pereira (REPUBLICANOS)','Silvia da Bancada Feminista (PSOL)','Silvão Leite (UNIÃO)','Thammy Miranda (PSD)'] },
    { sigla:'FIN', nome:'Finanças e Orçamento',
      membros:['Alessandro Guedes (PSD)','Ana Carolina Oliveira (PODE)','André Santos (REPUBLICANOS)','Gilberto Nascimento (PL)','João Ananias (PT)','Keit Lima (PSOL)','Major Palumbo (PP)','Marcelo Messias (MDB)','Silvinho Leite (UNIÃO)'] },
    { sigla:'URB', nome:'Política Urbana, Metropolitana e Meio Ambiente',

// ========== ESTADO ==========
let coms = [];          // comissões ativas (editáveis)
let itens = [];         // todos os itens da pauta (ordem original)
let cong = [];          // ordem do congresso: [{t:'item',iid:'item-5'}, {t:'pres',pid:'p-1'}, ...]
let pres = {};          // presença: pid -> {titulo, pr:{sigla:[nomes]}}
let selId = null;       // id selecionado no congresso (iid ou pid)
let aTab = 'cong';
let filtro = '';
let nPres = 2;
let nItem = 101;
let notas = '';         // anotações livres sobre o Congresso
let tmr = { tot:75*60, rem:75*60, on:false, id:null, t0:null, el:0 };

// estado da barra de votação simbólica
let svQuery = '';       // texto digitado
let svActive = 0;       // índice da sugestão selecionada
let svVoto = 'nao';     // voto atual da barra: 'sim'|'nao'|'abst' (modos variam se nominal)
let svFocus = false;    // re-focar o input após render disparado pela barra

// ========== INIT ==========
function init() {
    if (!load()) {
        coms = JSON.parse(JSON.stringify(COM_DEF));
        for (let i=1;i<=100;i++) itens.push(mkItem(i));
        // presença inicial vazia
        const p = mkPres(1);
        pres[p.id] = p;
        cong.push({t:'pres', pid:p.id});
    }
    render();
    events();
}

function mkItem(n) {
    return { id:'i-'+n, num:n, tit:'Item '+n,
             desc:'', pe:false, apregoado:false, nominal:false, cAtv:[], votos:{}, declaracoes:[] };
}
function mkPres(n) {
    return { id:'p-'+n, num:n, titulo:'Registro de Presença #'+n, pr:{}, herd:{} };
}
function getItem(iid) { return itens.find(i=>i.id===iid); }
function isSel(iid) { return cong.some(e=>e.t==='item'&&e.iid===iid); }

// ========== PERSISTÊNCIA ==========
function save() {
    try { localStorage.setItem('cong-cmsp', JSON.stringify({coms,itens,cong,pres,selId,aTab,nPres,nItem,notas,tmrRem:tmr.rem})); } catch(e){}
}
function load() {
    try {
        const d=JSON.parse(localStorage.getItem('cong-cmsp'));
        if(!d||!d.itens) return false;
        coms=d.coms; itens=d.itens; cong=d.cong; pres=d.pres;
        selId=d.selId; aTab=d.aTab||'cong'; nPres=d.nPres||2; nItem=d.nItem||101;
        notas=d.notas||'';
        tmr.rem=d.tmrRem!=null?d.tmrRem:75*60;
        return true;
    } catch(e){ return false; }
}

// ========== RENDER ==========
function render() {
    renderTabs();
    renderCong();
    renderItens();
    renderDet();
    renderTm();
    renderNotas();
}

function renderNotas() {
    const t=document.getElementById('anotacoes');
    if(t && t.value!==notas) t.value=notas;
}

function renderTabs() {
    document.querySelectorAll('.tabs button').forEach(b=>{
        b.classList.toggle('on', b.dataset.tab===aTab);
    });
    document.getElementById('t-cong').classList.toggle('on', aTab==='cong');
    document.getElementById('t-itens').classList.toggle('on', aTab==='itens');
}

// ---- Aba Congresso ----
function renderCong() {
    let nIt=0, nOk=0, nNo=0;
    cong.forEach(e=>{
        if(e.t==='item'){ nIt++; const r=calcRes(getItem(e.iid)); if(r==='ok')nOk++; else if(r==='no')nNo++; }
    });
    document.getElementById('st-cong').textContent = nIt+' itens | '+nOk+' aprov | '+nNo+' rej';

    const el=document.getElementById('l-cong');
    if(!cong.length){ el.innerHTML='<div class="ph" style="margin-top:20px">Nenhum item.<br>Use "Itens" para selecionar.</div>'; return; }

    let h='';
    cong.forEach((e,i)=>{
        if(e.t==='pres'){
            const p=pres[e.pid];
            h+='<div class="ent pres'+(selId===e.pid?' sel':'')+'" data-idx="'+i+'" onclick="sel(\''+e.pid+'\',\'pres\')">' +

               '<button class="bi rm" onclick="event.stopPropagation();rmPres(\''+e.pid+'\')">&#10005;</button></div>';

// ---- Navegação prev/next no congresso ----
function getCongNav(id) {
    const idx = cong.findIndex(e => (e.t==='item' && e.iid===id) || (e.t==='pres' && e.pid===id));
    if (idx < 0) return { prev:null, next:null };
    const prev = idx > 0 ? cong[idx-1] : null;
    const next = idx < cong.length-1 ? cong[idx+1] : null;
    return { prev, next };
}
function congEntryLabel(e) {
    if (e.t==='pres') { const p=pres[e.pid]; return p ? p.titulo : '?'; }
    const it=getItem(e.iid); return it ? it.tit : '?';
}
function congEntryId(e) { return e.t==='pres' ? e.pid : e.iid; }
function congEntryType(e) { return e.t==='pres' ? 'pres' : 'item'; }

function renderNavBar(id) {
    const nav = getCongNav(id);
    let h = '<div class="nav-bar">';
    if (nav.prev) {
        h += '<button class="nav-btn prev" onclick="sel(\''+congEntryId(nav.prev)+'\',\''+congEntryType(nav.prev)+'\')">' +
             '<span class="nav-arrow">&#8592;</span><span class="nav-label">'+esc(congEntryLabel(nav.prev))+'</span></button>';
    } else {
        h += '<button class="nav-btn prev" disabled><span class="nav-arrow">&#8592;</span><span class="nav-label">Início</span></button>';
    }
    if (nav.next) {
        h += '<button class="nav-btn next" onclick="sel(\''+congEntryId(nav.next)+'\',\''+congEntryType(nav.next)+'\')">' +
             '<span class="nav-label">'+esc(congEntryLabel(nav.next))+'</span><span class="nav-arrow">&#8594;</span></button>';
    } else {
        h += '<button class="nav-btn next" disabled><span class="nav-label">Fim</span><span class="nav-arrow">&#8594;</span></button>';
    }
    h += '</div>';
    return h;
}

function renderDet() {
    const el=document.getElementById('det');

    if(!selId){ el.innerHTML='<div class="ph">Selecione um item.</div>'; return; }

    // É item?
    const it=getItem(selId);
    if(it) { renderDetItem(el, it); return; }
    el.innerHTML='<div class="ph">Não encontrado.</div>';
}

// ========== VOTAÇÃO SIMBÓLICA ==========
// Normaliza para busca (minúsculas, sem acentos)
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

// Modos de voto disponíveis na barra conforme o tipo de votação do item
function svModos(it){ return it.nominal ? ['sim','nao','abst'] : ['nao','abst']; }
function svVotoLabel(v){ return v==='sim'?'Favorável':v==='nao'?'Contrário':v==='abst'?'Abstenção':'—'; }
function svVotoCls(v){ return v==='sim'?'fav':v==='nao'?'contra':v==='abst'?'abst':'nada'; }
function svCycle(it, dir){
    const modos=svModos(it);
    let i=modos.indexOf(svVoto); if(i<0) i=0;
    svVoto=modos[(i+dir+modos.length)%modos.length];
}

// Lista única de todos os vereadores (união dos membros de todas as comissões)
function vereadoresTodos(){
    const map=new Map();
    coms.forEach(c=>c.membros.forEach(m=>{ if(!map.has(m)) map.set(m,{nome:m}); }));
    return [...map.values()];
}

// Comissões ATIVAS do item das quais o vereador é membro
function vereadorComsAtivas(it, nome){
    return it.cAtv.filter(s=>{ const c=coms.find(c=>c.sigla===s); return c && c.membros.includes(nome); });
}

// Referência ao mapa de presença efetiva do item (ou null se não houver presença antes)
function presEfRef(iid){
    const idx=cong.findIndex(e=>e.t==='item'&&e.iid===iid);
    if(idx<0) return null;
    for(let i=idx-1;i>=0;i--){ if(cong[i].t==='pres') return pres[cong[i].pid].pr; }
    return null;
}

// Garante que o vereador conste como presente na comissão (para o voto contar no placar)
function svMarcarPresente(it, sigla, nome){
    const pr=presEfRef(it.id);
    if(!pr) return;
    if(!pr[sigla]) pr[sigla]=[];
    if(!pr[sigla].includes(nome)) pr[sigla].push(nome);
}

// Sugestões filtradas e ordenadas (membros das comissões do item primeiro)
function svFiltrar(it){
    const q=norm(svQuery.trim());
    if(!q) return [];
    let list=vereadoresTodos().filter(v=>norm(v.nome).includes(q)).map(v=>{
        const comsAtivas=vereadorComsAtivas(it, v.nome);
        return { nome:v.nome, inCom:comsAtivas.length>0, comsAtivas };
    });
    list.sort((a,b)=> (b.inCom - a.inCom) || a.nome.localeCompare(b.nome,'pt'));
    return list.slice(0, 8);
}

// HTML da seção (barra + lista de manifestações)
function svSecaoHtml(it){
    if(!it.declaracoes) it.declaracoes=[];
    if(!svModos(it).includes(svVoto)) svVoto=svModos(it)[0];
    const decl=it.declaracoes;
    let h='<div class="sv">';
    const svHint = it.nominal
        ? '(votação nominal — cada presente vota expressamente; sem manifestação = voto nenhum)'
        : '(favoráveis presumidos — registre só contrários e abstenções)';
    h+='<h3>'+(it.nominal?'Votação nominal':'Votação simbólica')+' <span class="sv-hint">'+svHint+'</span></h3>';
    h+='<div class="sv-bar">' +
       '<input id="sv-input" class="sv-input" type="text" autocomplete="off" spellcheck="false" placeholder="Digite o nome do vereador e tecle Enter…">' +
       '<span id="sv-mode" class="sv-mode '+svVotoCls(svVoto)+'" title="Tocar para alternar">' +
       '<span class="sv-mode-lbl">'+svVotoLabel(svVoto)+'</span><span class="sv-caret">&#9660;</span></span>' +
       '<div id="sv-sug" class="sv-sug"></div>' +
       '</div>';
    h+='<p class="sv-keys">&#8593;&#8595; escolher &middot; &#8592;&#8594; alterna '+svModos(it).map(svVotoLabel).join('/')+' &middot; Enter ou Espaço confirma</p>' +
       '<p class="sv-keys">Barra vazia: Espaço '+(it.apregoado?'desmarca':'marca')+' apregoado &middot; &#8593;&#8595; troca de item</p>';
    if(decl.length){
        h+='<div class="sv-list">';
        decl.forEach((d,i)=>{
            const cls=svVotoCls(d.voto);
            const lbl=svVotoLabel(d.voto);
            const fora=vereadorComsAtivas(it, d.vereador).length===0;
            h+='<div class="sv-li">' +
               '<span class="sv-seq">'+(i+1)+'</span>' +
               '<span class="sv-badge '+cls+'">'+lbl+'</span>' +
               '<span class="sv-nome">'+esc(d.vereador)+(fora?' <span class="sv-fora">fora das comissões</span>':'')+'</span>' +
               (d.digitado&&d.digitado!==d.vereador?'<span class="sv-dig">"'+esc(d.digitado)+'"</span>':'') +
               '<button class="sv-rm" onclick="svRemove(getItem(\''+it.id+'\'),'+i+')" title="Remover">&#10005;</button>' +
               '</div>';
        });
        h+='</div>';
    } else {
        h+='<p class="sv-empty">Nenhuma manifestação registrada ainda.</p>';
    }
    h+='</div>';
    return h;
}

// Renderiza só a caixa de sugestões e o indicador de voto (sem reconstruir o detalhe)
function svRenderSug(it){
    const mode=document.getElementById('sv-mode');
    if(mode){
        const lbl=mode.querySelector('.sv-mode-lbl');
        if(lbl) lbl.textContent=svVotoLabel(svVoto);
        mode.className='sv-mode '+svVotoCls(svVoto);
    }
    const box=document.getElementById('sv-sug');
    if(!box) return;
    const sug=svFiltrar(it);
    if(svActive>=sug.length) svActive=Math.max(0, sug.length-1);
    if(!sug.length){ box.innerHTML=''; box.classList.remove('show'); return; }
    box.classList.add('show');
    box.innerHTML=sug.map((s,i)=>
        '<div class="sv-sug-item'+(s.inCom?' incom':'')+(i===svActive?' active':'')+'" data-sv-idx="'+i+'">' +
        '<span class="sv-sug-nome">'+esc(s.nome)+'</span>' +
        (s.inCom?'<span class="sv-sug-tag">'+esc(s.comsAtivas.join(', '))+'</span>':'') +
        '</div>'
    ).join('');
}

// Liga eventos do input (sem disparar render global ao digitar, para não perder o foco)
function svBind(it){
    const inp=document.getElementById('sv-input');
    if(!inp) return;
    inp.value=svQuery;
    inp.oninput=e=>{ svQuery=e.target.value; svActive=0; svRenderSug(it); };
    inp.onkeydown=e=>{
        // Barra vazia: atalhos de operação por teclado
        if(svQuery.trim()===''){
            if(e.key===' '){ e.preventDefault(); svFocus=true; togApregoado(it.id); return; }
            if(e.key==='ArrowDown'){ e.preventDefault(); navItemTeclado(it, 1); return; }
            if(e.key==='ArrowUp'){ e.preventDefault(); navItemTeclado(it, -1); return; }
        }
        const sug=svFiltrar(it);
        if(e.key==='ArrowDown'){ e.preventDefault(); if(sug.length){ svActive=(svActive+1)%sug.length; svRenderSug(it); } }
        else if(e.key==='ArrowUp'){ e.preventDefault(); if(sug.length){ svActive=(svActive-1+sug.length)%sug.length; svRenderSug(it); } }
        else if(e.key==='ArrowLeft'){ e.preventDefault(); svCycle(it,-1); svRenderSug(it); }
        else if(e.key==='ArrowRight'){ e.preventDefault(); svCycle(it,1); svRenderSug(it); }
        else if(e.key==='Enter'){ e.preventDefault(); if(sug.length){ svConfirm(it, sug[Math.min(svActive, sug.length-1)]); } }
        // Espaço também aceita a sugestão selecionada (mais rápido). Só quando há
        // sugestões; sem sugestões, o espaço é digitado normalmente para refinar a busca.
        else if(e.key===' ' && sug.length){ e.preventDefault(); svConfirm(it, sug[Math.min(svActive, sug.length-1)]); }
        else if(e.key==='Escape'){ e.preventDefault(); svQuery=''; e.target.value=''; svActive=0; svRenderSug(it); }
    };
    const box=document.getElementById('sv-sug');
    if(box){ box.onmousedown=e=>{ const el=e.target.closest('[data-sv-idx]'); if(!el) return; e.preventDefault(); const sug=svFiltrar(it); const i=parseInt(el.dataset.svIdx); if(sug[i]) svConfirm(it, sug[i]); }; }
    const mode=document.getElementById('sv-mode');
    if(mode){ mode.onmousedown=e=>{ e.preventDefault(); svCycle(it,1); svRenderSug(it); const i=document.getElementById('sv-input'); if(i) i.focus(); }; }
    svRenderSug(it);
    if(svFocus){ svFocus=false; inp.focus(); }
}

// Confirma uma manifestação
function svConfirm(it, sug){
    if(!it.declaracoes) it.declaracoes=[];
    it.declaracoes.push({ digitado:svQuery.trim(), vereador:sug.nome, voto:svVoto });
    // integra com o placar das comissões ativas das quais o vereador é membro
    sug.comsAtivas.forEach(s=>{
        if(!it.votos[s]) it.votos[s]={};
        it.votos[s][sug.nome]=svVoto;
        svMarcarPresente(it, s, sug.nome);
    });
    svQuery=''; svActive=0; svVoto=svModos(it)[0];   // volta ao padrão (Favorável se nominal, senão Contrário)
    svFocus=true;
    save(); render();
}

// Remove uma manifestação da lista (e reverte o voto na comissão, se for o caso)
function svRemove(it, idx){
    if(!it||!it.declaracoes) return;
    const d=it.declaracoes[idx];
    if(!d) return;
    it.declaracoes.splice(idx,1);
    const aindaDeclarado=it.declaracoes.some(x=>x.vereador===d.vereador);
    if(!aindaDeclarado){
        vereadorComsAtivas(it, d.vereador).forEach(s=>{
            if(it.votos[s] && it.votos[s][d.vereador]!=null) delete it.votos[s][d.vereador];
        });
    }
    svFocus=true;
    save(); render();
}

// ========== LÓGICA ==========
function getPresEf(iid) {
    // Presença efetiva: última presença ANTES deste item na ordem do congresso
    const idx=cong.findIndex(e=>e.t==='item'&&e.iid===iid);
    if(idx<0) return {};
    for(let i=idx-1;i>=0;i--){
        if(cong[i].t==='pres') return pres[cong[i].pid].pr;
    }
    return {};
}

function resComissao(it, sigla, presentes) {
    const def = it.nominal ? 'nada' : 'sim';
    let sim=0, nao=0, abst=0, nada=0;
    presentes.forEach(m=>{
        const v=(it.votos[sigla]&&it.votos[sigla][m])||def;
        if(v==='sim') sim++; else if(v==='nao') nao++; else if(v==='abst') abst++; else nada++;
    });
    const c=coms.find(c=>c.sigla===sigla);
    const total=c?c.membros.length:0;
    const maioria=Math.floor(total/2)+1;
    const res=sim>=maioria?'ok':nao>=maioria?'no':'pe';
    return { sim, nao, abst, nada, tot:presentes.length, total, maioria, res };
}

function calcRes(it) {
    if(it.cAtv.length===0||!it.apregoado) return 'pe';
    const ef=getPresEf(it.id);
    let fav=0, con=0;
    it.cAtv.forEach(s=>{
        const pr=ef[s]||[];
        const rv=resComissao(it,s,pr);
        if(rv.res==='ok') fav++; else if(rv.res==='no') con++;
    });
    if(fav>it.cAtv.length/2) return 'ok';
    if(con>it.cAtv.length/2) return 'no';
    return 'pe';
}

function votavel(it) {
    if(it.cAtv.length===0) return false;
    const ef=getPresEf(it.id);
    let cq=0;
    it.cAtv.forEach(s=>{
        const c=coms.find(c=>c.sigla===s);
        if(!c) return;
        const pr=ef[s]||[];
        if(pr.length>=Math.floor(c.membros.length/2)+1) cq++;
    });
    return cq>it.cAtv.length/2;
}

function getConvocadas() {
    const s=new Set();
    cong.forEach(e=>{ if(e.t==='item'){ const it=getItem(e.iid); if(it) it.cAtv.forEach(c=>s.add(c)); } });
    return s;
}

// Navega para o próximo/anterior ITEM na ordem do congresso (pula presenças).

function navItemTeclado(it, dir){
    const idx=cong.findIndex(e=>e.t==='item'&&e.iid===it.id);
    if(idx<0) return;
    if(dir>0){ for(let i=idx+1;i<cong.length;i++){ if(cong[i].t==='item'){ sel(cong[i].iid,'item'); return; } } }
    else { for(let i=idx-1;i>=0;i--){ if(cong[i].t==='item'){ sel(cong[i].iid,'item'); return; } } }

function togNominal(iid) {

function addPres() {
    const n=nPres++;
    const p=mkPres(n);
    // herdar da presença anterior mais próxima
    const prevPres = findPrevPres();
    if(prevPres) {
        coms.forEach(c=>{
            p.pr[c.sigla] = prevPres.pr[c.sigla] ? [...prevPres.pr[c.sigla]] : [];
            p.herd[c.sigla] = [...p.pr[c.sigla]];
        });
    }
    pres[p.id]=p;
    // inserir após o item selecionado no congresso, ou no final
    if(selId) {
        const idx=cong.findIndex(e=>(e.t==='item'&&e.iid===selId)||(e.t==='pres'&&e.pid===selId));
        if(idx>-1) { cong.splice(idx+1,0,{t:'pres',pid:p.id}); }
        else cong.push({t:'pres',pid:p.id});
    } else { cong.push({t:'pres',pid:p.id}); }
    selId=p.id;
    save(); render();
}

function findPrevPres() {
    // última presença no congresso
    for(let i=cong.length-1;i>=0;i--){
        if(cong[i].t==='pres') return pres[cong[i].pid];
    }
    return null;
}

function rmPres(pid) {
    cong=cong.filter(e=>!(e.t==='pres'&&e.pid===pid));
    delete pres[pid];
    if(selId===pid) selId=null;
    save(); render();
}

function addPe() {

function togPres(pid, ci, mi) {
    const p=pres[pid]; if(!p) return;
    const s=coms[ci].sigla, m=coms[ci].membros[mi];
    if(!p.pr[s]) p.pr[s]=[];

function presAll(pid, val) {

function togCom(iid, sigla) {
    const it=getItem(iid); if(!it) return;
    const idx=it.cAtv.indexOf(sigla);
    if(idx>-1){ it.cAtv.splice(idx,1); delete it.votos[sigla]; }

function togVoto(iid, sigla, ci, mi) {
    const it=getItem(iid); if(!it) return;
    const m=coms[ci].membros[mi];
    if(!it.votos[sigla]) it.votos[sigla]={};
    const ciclo = it.nominal ? ['nada','sim','nao','abst'] : ['sim','nao','abst'];
    const cur=it.votos[sigla][m]||ciclo[0];
    let i=ciclo.indexOf(cur); if(i<0) i=0;
    it.votos[sigla][m]=ciclo[(i+1)%ciclo.length];
    save(); render();
}

function renderTm() {

function playTm() {
    if(tmr.on) return;
    tmr.on=true; tmr.t0=Date.now(); tmr.el=0;
    tmr.id=setInterval(()=>{
        const t=Math.floor((Date.now()-tmr.t0)/1000);
        if(t>tmr.el){ tmr.rem-=(t-tmr.el); tmr.el=t; if(tmr.rem<=0){tmr.rem=0;pauseTm();} renderTm();save(); }
    },250);
    document.getElementById('bt-play').disabled=true;
    document.getElementById('bt-pause').disabled=false;
}
function pauseTm() {
    tmr.on=false; clearInterval(tmr.id);
    document.getElementById('bt-play').disabled=false;
    document.getElementById('bt-pause').disabled=true;
}
function resetTm() { pauseTm(); tmr.rem=tmr.tot; renderTm(); save(); }

function updMem(ci,mi,nome) {

        if(p.pr[sig]){ const i=p.pr[sig].indexOf(ant); if(i>-1) p.pr[sig][i]=nome; }

    itens.forEach(it=>{
        if(it.votos[sig]&&it.votos[sig][ant]!=null){ it.votos[sig][nome]=it.votos[sig][ant]; delete it.votos[sig][ant]; }

        if(p.pr[sig]) p.pr[sig]=p.pr[sig].filter(m=>m!==nome);

// ========== IMPORTAR / EXPORTAR TEXTO ==========
function exportState() {
    let txt = '=== COMISSÕES ===\n\n';
    txt += coms.map(c =>
        c.sigla + ' | ' + c.nome + '\n' + c.membros.join('\n')
    ).join('\n\n');

    if (cong.length > 0) {
        txt += '\n\n=== CONGRESSO ===';
        cong.forEach(e => {
            txt += '\n\n';
            if (e.t === 'pres') {
                const p = pres[e.pid];
                txt += 'PRESENÇA #' + p.num;
                coms.forEach(c => {
                    const pr = p.pr[c.sigla] || [];
                    if (pr.length > 0) txt += '\n' + c.sigla + ': ' + pr.join('; ');
                });
            } else {
                const it = getItem(e.iid);
                if (!it) return;
                txt += 'ITEM ' + it.num + (it.pe ? ' | PÉ' : '') + (it.apregoado ? ' | APREGOADO' : '') + (it.nominal ? ' | NOMINAL' : '');
                txt += '\nTítulo: ' + it.tit;
                if (it.desc) txt += '\nDescrição: ' + it.desc.replace(/\n/g, ' ');
                if (it.cAtv.length > 0) {
                    txt += '\nComissões: ' + it.cAtv.join(', ');
                    it.cAtv.forEach(s => {
                        const votos = it.votos[s] || {};
                        const parts = Object.entries(votos).filter(([m, v]) => v !== 'nada').map(([m, v]) =>
                            m + '=' + (v === 'sim' ? 'S' : v === 'nao' ? 'N' : 'A')
                        );
                        if (parts.length > 0) txt += '\nVotos ' + s + ': ' + parts.join('; ');
                    });
                }
                if (it.declaracoes && it.declaracoes.length > 0) {
                    txt += '\nManifestações: ' + it.declaracoes.map(d =>
                        d.vereador + '=' + (d.voto === 'nao' ? 'C' : d.voto === 'abst' ? 'A' : 'F')
                    ).join('; ');
                }
            }
        });
    }
    if (notas && notas.trim()) {
        txt = txt.trimEnd() + '\n\n=== ANOTAÇÕES ===\n' + notas.trim();
    }
    return txt.trimEnd();
}

function importState(txt) {
    // Extrair anotações (texto livre) — deve ser a última seção; capturada verbatim
    let notasImport = '';
    const mNotas = txt.match(/\n?===\s*ANOTA[ÇC][ÕO]ES\s*===[ \t]*\n?/i);
    if (mNotas) {
        notasImport = txt.substring(mNotas.index + mNotas[0].length);
        txt = txt.substring(0, mNotas.index);
    }
    // Dividir em linhas e agrupar por seções e blocos
    const lines = txt.split('\n');
    let section = null;
    let block = [];
    const blocks = { com: [], cong: [] };

    for (const line of lines) {
        const trimmed = line.trim();
        if (/^===\s*COMISS[ÕO]ES\s*===$/i.test(trimmed)) {
            if (block.length > 0 && section) blocks[section].push(block);
            section = 'com'; block = []; continue;
        }
        if (/^===\s*CONGRESSO\s*===$/i.test(trimmed)) {
            if (block.length > 0 && section) blocks[section].push(block);
            section = 'cong'; block = []; continue;
        }
        if (section) {
            if (trimmed === '') {
                if (block.length > 0) { blocks[section].push(block); block = []; }
            } else {
                block.push(trimmed);
            }
        }
    }
    if (block.length > 0 && section) blocks[section].push(block);

    // --- Parsear comissões ---
    const newComs = [];
    for (const bl of blocks.com) {
        const cab = bl[0];
        const sep = cab.indexOf('|');
        if (sep < 0) return { ok: false, erro: 'Formato inválido: "' + cab + '". Use: SIGLA | Nome' };
        const sigla = cab.substring(0, sep).trim();
        const nome = cab.substring(sep + 1).trim();
        if (!sigla) return { ok: false, erro: 'Sigla vazia em: "' + cab + '"' };
        const membros = bl.slice(1).filter(l => l);
        if (membros.length === 0) return { ok: false, erro: 'Comissão "' + sigla + '" sem membros.' };
        newComs.push({ sigla, nome, membros });
    }
    if (newComs.length === 0) return { ok: false, erro: 'Nenhuma comissão encontrada.' };

    // --- Resetar estado ---
    coms = newComs;
    itens = [];
    for (let i = 1; i <= 100; i++) itens.push(mkItem(i));
    cong = [];
    pres = {};
    nPres = 2;
    nItem = 101;
    notas = notasImport.replace(/^\n+/, '').trimEnd();

    // --- Parsear congresso ---
    for (const bl of blocks.cong) {
        const header = bl[0];

        // Presença
        const presMatch = header.match(/^PRESEN[CÇ]A\s*#(\d+)$/i);
        if (presMatch) {
            const num = parseInt(presMatch[1]);
            if (num >= nPres) nPres = num + 1;
            const p = mkPres(num);
            for (let i = 1; i < bl.length; i++) {
                const col = bl[i].indexOf(':');
                if (col < 0) continue;
                const sig = bl[i].substring(0, col).trim();
                const membros = bl[i].substring(col + 1).split(';').map(m => m.trim()).filter(m => m);
                p.pr[sig] = membros;
            }
            pres[p.id] = p;
            cong.push({ t: 'pres', pid: p.id });
            continue;
        }

        // Item
        const itemMatch = header.match(/^ITEM\s+(\d+)(.*)$/i);
        if (itemMatch) {
            const num = parseInt(itemMatch[1]);
            const flags = itemMatch[2] || '';
            const pe = /\|\s*P[ÉE]\s*(\||$)/i.test(flags);
            const apregoado = /APREGOADO/i.test(flags);
            const nominal = /NOMINAL/i.test(flags);
            let it = itens.find(x => x.id === 'i-' + num);
            if (!it) {
                it = mkItem(num);
                itens.push(it);
                if (num >= nItem) nItem = num + 1;
            }
            it.pe = pe;
            it.apregoado = apregoado;
            it.nominal = nominal;
            for (let i = 1; i < bl.length; i++) {
                const line = bl[i];
                if (/^T[ií]tulo:/i.test(line)) {
                    it.tit = line.replace(/^T[ií]tulo:\s*/i, '');
                } else if (/^Descri[çc][ãa]o:/i.test(line)) {
                    it.desc = line.replace(/^Descri[çc][ãa]o:\s*/i, '');
                } else if (/^Comiss[õo]es:/i.test(line)) {
                    it.cAtv = line.replace(/^Comiss[õo]es:\s*/i, '').split(',').map(s => s.trim()).filter(s => s);
                } else if (/^Votos\s+/i.test(line)) {
                    const col = line.indexOf(':');
                    const sig = line.substring(6, col).trim();
                    const votosStr = line.substring(col + 1).trim();
                    it.votos[sig] = {};
                    votosStr.split(';').forEach(v => {
                        const eq = v.lastIndexOf('=');
                        if (eq < 0) return;
                        const membro = v.substring(0, eq).trim();
                        const vl = v.substring(eq + 1).trim().toUpperCase();
                        it.votos[sig][membro] = vl === 'S' ? 'sim' : vl === 'N' ? 'nao' : 'abst';
                    });
                } else if (/^Manifesta[çc][õo]es:/i.test(line)) {
                    const val = line.replace(/^Manifesta[çc][õo]es:\s*/i, '');
                    it.declaracoes = val.split(';').map(x => x.trim()).filter(Boolean).map(x => {
                        const eq = x.lastIndexOf('=');
                        if (eq < 0) return null;
                        const vereador = x.substring(0, eq).trim();
                        const vl = x.substring(eq + 1).trim().toUpperCase();
                        const voto = vl === 'A' ? 'abst' : vl === 'F' ? 'sim' : 'nao';
                        return { digitado: vereador, vereador, voto };
                    }).filter(Boolean);
                }
            }
            cong.push({ t: 'item', iid: it.id });
            continue;
        }

        return { ok: false, erro: 'Bloco não reconhecido: "' + header + '"' };
    }

    selId = null;
    save();
    return { ok: true };
}

function aplicarTxt() {
    const ta = document.getElementById('cfg-txt-area');
    const msg = document.getElementById('cfg-txt-msg');
    if (!confirm('Isso substituirá todos os dados atuais. Continuar?')) return;
    const res = importState(ta.value);
    if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = 'Dados importados com sucesso!';
        renderCfg(); render();
    } else {
        msg.className = 'msg err';
        msg.textContent = res.erro;
    }
    setTimeout(() => { msg.className = 'msg'; msg.textContent = ''; }, 5000);
}

function copiarTxt() {
    const ta = document.getElementById('cfg-txt-area');
    ta.select();
    navigator.clipboard.writeText(ta.value).then(() => {
        const msg = document.getElementById('cfg-txt-msg');
        msg.className = 'msg ok';
        msg.textContent = 'Copiado!';
        setTimeout(() => { msg.className = 'msg'; msg.textContent = ''; }, 2000);
    });
}

// ========== NOVO ==========
function novo() {
    if(!confirm('Limpar todos os dados?')) return;
    localStorage.removeItem('cong-cmsp');
    location.reload();
}

// ========== DRAG AND DROP ==========
let dragState = null;

function onDragStart(e) {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const ent = handle.closest('.ent');
    if (!ent || ent.dataset.idx == null) return;
    e.preventDefault();
    const idx = parseInt(ent.dataset.idx);
    dragState = { idx, targetIdx: idx };
    ent.classList.add('dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
    if (!dragState) return;
    e.preventDefault();
    const lst = document.getElementById('l-cong');
    const entries = [...lst.querySelectorAll('.ent')];
    lst.querySelectorAll('.drag-line').forEach(l => l.remove());

    let targetIdx = cong.length;
    for (let i = 0; i < entries.length; i++) {
        const rect = entries[i].getBoundingClientRect();
        if (e.clientY < rect.top + rect.height / 2) {
            targetIdx = parseInt(entries[i].dataset.idx);
            entries[i].insertAdjacentHTML('beforebegin', '<div class="drag-line"></div>');
            dragState.targetIdx = targetIdx;
            autoScroll(lst, e.clientY);
            return;
        }
    }
    if (entries.length > 0) {
        entries[entries.length - 1].insertAdjacentHTML('afterend', '<div class="drag-line"></div>');
    }
    dragState.targetIdx = targetIdx;
    autoScroll(lst, e.clientY);
}

function autoScroll(lst, y) {
    const r = lst.getBoundingClientRect();
    if (y < r.top + 30) lst.scrollTop -= 10;
    else if (y > r.bottom - 30) lst.scrollTop += 10;
}

function onDragEnd() {
    if (!dragState) return;
    const lst = document.getElementById('l-cong');
    lst.querySelectorAll('.drag-line').forEach(l => l.remove());
    const d = lst.querySelector('.ent.dragging');
    if (d) d.classList.remove('dragging');
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);

    const { idx, targetIdx } = dragState;
    dragState = null;
    if (targetIdx !== idx && targetIdx !== idx + 1) {
        const [item] = cong.splice(idx, 1);
        const insertAt = targetIdx > idx ? targetIdx - 1 : targetIdx;
        cong.splice(insertAt, 0, item);
        save(); render();
    }
}

// ========== UTIL ==========
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function ea(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ========== EVENTOS ==========
function events() {
    document.querySelectorAll('.tabs button').forEach(b=>{
        b.addEventListener('click',()=>{ aTab=b.dataset.tab; save(); renderTabs(); });
    });
    document.getElementById('busca').addEventListener('input',e=>{ filtro=e.target.value; renderItens(); });
    document.getElementById('anotacoes').addEventListener('input',e=>{ notas=e.target.value; save(); });
    document.getElementById('bt-play').addEventListener('click', playTm);
    document.getElementById('bt-pause').addEventListener('click', pauseTm);
    document.getElementById('bt-reset').addEventListener('click', resetTm);
    document.getElementById('bt-pres').addEventListener('click', addPres);
    document.getElementById('bt-pe').addEventListener('click', addPe);
    document.getElementById('bt-cfg').addEventListener('click', abrirCfg);
    document.getElementById('bt-novo').addEventListener('click', novo);
    document.getElementById('bt-menu').addEventListener('click', togMenu);
    document.getElementById('side-backdrop').addEventListener('click', closeMenu);
    document.getElementById('modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) fecharCfg(); });
    document.getElementById('l-cong').addEventListener('pointerdown', onDragStart);
}

// ========== START ==========
document.addEventListener('DOMContentLoaded', init);
