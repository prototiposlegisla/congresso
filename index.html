// ========== ATUALIZAR PAUTA (MESCLAR) ==========
// Em vez de substituir tudo, compara uma lista de itens recebida (PDF de Congresso do SGP2
// ou texto de importação) com a pauta atual e aplica só as diferenças escolhidas.
// Os itens são casados pelo projeto ("PL 775/2026"), não pelo número na pauta.
// Presenças, votos, apregoados, ordem e separadores não são tocados.
const PROJ_RE = /\b(PL|PDL|PR|PLO)\s*(?:n[ºo.]?\s*)?0*(\d+)\s*\/\s*(\d{4})\b/i;
function projKey(s) {
    const m=(s||'').match(PROJ_RE);
    return m ? m[1].toUpperCase()+' '+parseInt(m[2])+'/'+m[3] : '';
}
function itemKey(it) { return projKey(it.tit) || projKey(it.desc); }
function itemPlaceholder(it) { return /^(Item|Pé)\s+\d+$/.test((it.tit||'').trim()); }

// ---- Leitura do texto de importação (só os blocos ITEM) ----
function parseItensTxt(txt) {
    const out=[]; let cur=null;
    txt.split('\n').forEach(l=>{
        const line=l.trim();
        const m=line.match(/^ITEM\s+(\d+)(.*)$/i);
        if(m){
            cur={ num:parseInt(m[1]), pe:/\|\s*P[ÉE]\s*(\||$)/i.test(m[2]||''), tit:'', desc:'', cAtv:null };
            out.push(cur); return;
        }
        if(!cur) return;
        if(/^T[ií]tulo:/i.test(line)) cur.tit=line.replace(/^T[ií]tulo:\s*/i,'');
        else if(/^Descri[çc][ãa]o:/i.test(line)) cur.desc=line.replace(/^Descri[çc][ãa]o:\s*/i,'');
        else if(/^Comiss[õo]es:/i.test(line)) cur.cAtv=line.replace(/^Comiss[õo]es:\s*/i,'').split(',').map(s=>s.trim()).filter(Boolean);
        else if(line===''||/^(===|PRESEN|SEPARADOR)/i.test(line)) cur=null;
    });
    out.forEach(o=>{ o.key=projKey(o.tit)||projKey(o.desc); });
    return out;
}

// ---- Leitura do PDF "Reunião Conjunta das Comissões" (relatório de Congresso do SGP2) ----
// Recebe as páginas já extraídas: [[{s,x,y}]] (y de cima para baixo). Layout do relatório:
// linha do projeto ("PL 775 /2026 , DO EXECUTIVO") à esquerda, "* ITEM NA PAUTA n" logo acima,
// ementa na coluna da esquerda (x < 187) e uma coluna por comissão à direita (x >= 187).
const PDF_COL_COM = 187;
const PDF_COMS = [['JUST-','CCJ'],['URB-','URB'],['ADMINISTRA','ADM'],['ECON-','ECON'],['EDUCA','EDUC'],['SAUDE','SAUDE'],['FINAN','FIN']];
function nomeAutor(s) {
    s=s.replace(/^[\s,]+/,'').replace(/^d[oa]s?\s+Vereador(?:\(?[ae]s?\)?)*(?:\(as\))?\s*/i,'').trim();
    if(/^DA\s+MESA/i.test(s)) return 'Mesa da Câmara';
    s=s.replace(/^d[oa]s?\s+/i,'').replace(/[\s,]+$/,'');
    if(/^EXECUTIVO$/i.test(s)) return 'Executivo';
    const min=['da','de','do','das','dos','e'];
    // nomes em maiúsculas -> iniciais maiúsculas; o que está entre parênteses (partido) fica como veio
    return s.split(/(\([^)]*\))/).map((p,i)=> i%2 ? p :
        p.toLowerCase().replace(/[^\s,.\-]+/g,(w,off)=> (off>0&&min.includes(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1))
    ).join('').replace(/\s+/g,' ').trim();
}
function parsePautaPdf(pages) {
    const itens=[], avisos=[]; let ult=null, detalhada=false;
    pages.forEach((pg,pi)=>{
        const its=pg.filter(t=>t.s.trim()).map(t=>({s:t.s.trim(),x:t.x,y:t.y}));
        if(its.some(t=>/Pauta Detalhada/i.test(t.s))) detalhada=true;
        // rodapé: tudo na altura de "Página n de m"
        const rod=its.find(t=>/^P[áa]gina\s+\d+\s+de\s+\d+/i.test(t.s));
        const yMax=rod?rod.y-6:1e9;
        // linhas de projeto: um "PL" (ou PDL/PR/PLO) solto ou no começo, na margem esquerda
        const projs=[];
        its.filter(t=>t.x<PDF_COL_COM && /^(PL|PDL|PR|PLO)(\s|$)/.test(t.s) && t.y<yMax).forEach(t=>{
            const linha=its.filter(o=>Math.abs(o.y-t.y)<3).sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ');
            const m=linha.match(/^(PL|PDL|PR|PLO)\s+0*(\d+)\s*\/\s*(\d{4})\s*(.*)$/);
            if(m && !projs.some(p=>Math.abs(p.y-t.y)<3)) projs.push({ y:t.y, key:m[1]+' '+parseInt(m[2])+'/'+m[3], resto:m[4] });
        });
        projs.sort((a,b)=>a.y-b.y);
        if(!projs.length){
            // página de continuação: ementa que não coube na anterior
            if(ult){
                const cont=its.filter(t=>t.x<PDF_COL_COM && t.y<yMax && t.y>150 && !/ITEM NA PAUTA/i.test(t.s))
                    .sort((a,b)=>(a.y-b.y)||(a.x-b.x)).map(t=>t.s).join(' ');
                if(cont) ult.ementa=(ult.ementa+' '+cont).trim();
            }
            return;
        }
        projs.forEach((p,i)=>{
            const yFim=Math.min(i+1<projs.length?projs[i+1].y-25:1e9, yMax);
            // número na pauta: marcador "* ITEM NA PAUTA" perto da linha do projeto
            let num=null;
            const mk=its.find(t=>/ITEM NA PAUTA/i.test(t.s) && t.y>p.y-25 && t.y<p.y+6);
            if(mk){
                const mm=mk.s.match(/ITEM NA PAUTA\s*(\d+)/i);
                if(mm) num=parseInt(mm[1]);
                else { const d=its.find(t=>/^\d+$/.test(t.s) && Math.abs(t.y-mk.y)<4 && t.x>mk.x); if(d) num=parseInt(d.s); }
            }
            // autor: resto da linha do projeto (tirando o marcador, se estiver na mesma linha) + eventual 2ª linha
            let autor=p.resto.replace(/\*?\s*ITEM NA PAUTA\s*\d*\s*$/i,'').trim();
            const corpo=its.filter(t=>t.y>p.y+3 && t.y<yFim);
            const esq=corpo.filter(t=>t.x<PDF_COL_COM).sort((a,b)=>(a.y-b.y)||(a.x-b.x));
            const emIts=esq.filter(t=>t.x<100);
            const ementa=emIts.map(t=>t.s).join(' ').replace(/\s+/g,' ').trim();
            // 2ª linha de autores: na coluna do autor, entre a linha do projeto e o começo da ementa
            const yEm=emIts.length?emIts[0].y:p.y+25;
            esq.filter(t=>t.x>=100 && t.y<yEm-3).forEach(t=>{ autor+=' '+t.s; });
            // comissões: 1ª linha de cada coluna à direita
            const dir=corpo.filter(t=>t.x>=PDF_COL_COM).sort((a,b)=>(a.x-b.x)||(a.y-b.y));
            const cols=[]; dir.forEach(t=>{ if(!cols.length||t.x-cols[cols.length-1].x>10) cols.push(t); });
            const cAtv=[];
            cols.forEach(t=>{
                const n=norm(t.s).toUpperCase();
                const hit=PDF_COMS.find(c=>n.startsWith(c[0]));
                if(hit){ if(!cAtv.includes(hit[1])) cAtv.push(hit[1]); }
                else avisos.push(p.key+': comissão não reconhecida ("'+t.s+'") — confira no PDF');
            });
            if(!cAtv.length) avisos.push(p.key+': nenhuma comissão identificada (pág. '+(pi+1)+')');
            ult={ num, key:p.key, autor:nomeAutor(autor), ementa, cAtv, pe:false };
            itens.push(ult);
        });
    });
    if(!itens.length){
        return { ok:false, erro: detalhada
            ? 'Este PDF é a Pauta Detalhada da sessão, que não traz as comissões por item. Use o PDF de Congresso ("Reunião Conjunta das Comissões").'
            : 'Não reconheci itens neste PDF. Ele precisa ser o relatório de Congresso do SGP2 ("Reunião Conjunta das Comissões"); para outros formatos, use o EXECUTAR.bat.' };
    }
    return { ok:true, itens, avisos };
}
function titPdf(o, pe) {
    let em=o.ementa||'';
    if(em.length>90) em=em.substring(0,88).replace(/\s+\S*$/,'')+'…';
    return (pe?'Pé':'Item')+(o.num!=null?' '+o.num:'')+' - '+o.key+(em?' - '+em:'');
}
function descPdf(o) { return (o.autor?'Autor: '+o.autor+'. ':'')+(o.ementa||''); }

// ---- pdf.js (carregado só quando um PDF é usado; precisa de internet) ----
const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsProm=null;
function carregarPdfjs() {
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if(!pdfjsProm) pdfjsProm=new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src=PDFJS_URL+'pdf.min.js';
        s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_URL+'pdf.worker.min.js'; res(window.pdfjsLib); };
        s.onerror=()=>{ pdfjsProm=null; rej(new Error('não consegui carregar o leitor de PDF (sem internet?)')); };
        document.head.appendChild(s);
    });
    return pdfjsProm;
}
async function lerPdf(file) {
    const lib=await carregarPdfjs();
    const doc=await lib.getDocument({ data:new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages=[];
    for(let n=1;n<=doc.numPages;n++){
        const pg=await doc.getPage(n);
        const h=pg.getViewport({scale:1}).height;
        const tc=await pg.getTextContent();
        pages.push(tc.items.map(t=>({ s:t.str, x:t.transform[4], y:h-t.transform[5] })));
    }
    return parsePautaPdf(pages);
}

// ---- Entrada: arquivos (botão ou arrastar) e texto colado ----
let mg=null;   // estado do diálogo: {fonte, src:'pdf'|'txt', inc:[], avisos:[], full, pe, on:Set}

async function atlArquivos(files) {
    const lst=[...files]; if(!lst.length) return;
    const inc=[], avisos=[], nomes=[]; let src='txt';
    for(const f of lst){
        try {
            if(/\.pdf$/i.test(f.name)){
                src='pdf';
                const r=await lerPdf(f);
                if(!r.ok){ alert(f.name+': '+r.erro); continue; }
                inc.push(...r.itens); avisos.push(...r.avisos);
            } else {
                const txt=await f.text();
                // primeiro carregamento do dia: nada na pauta ainda e o texto traz a composição
                if(lst.length===1 && /===\s*COMISS[ÕO]ES\s*===/i.test(txt) && !cong.some(e=>e.t==='item')){
                    if(confirm('A pauta está vazia. Carregar o arquivo inteiro (comissões + pauta)? Isso substitui os dados atuais.')){
                        const r=importState(txt);
                        if(!r.ok) alert(r.erro);
                        render(); return;
                    }
                }
                const its=parseItensTxt(txt);
                if(!its.length){ alert(f.name+': nenhum bloco ITEM encontrado.'); continue; }
                inc.push(...its);
            }
            nomes.push(f.name);
        } catch(e){ alert(f.name+': '+(e&&e.message?e.message:e)); }
    }
    if(inc.length) mgAbrir(inc, src, nomes.join(', '), avisos);
}

function mesclarTxt() {
    const ta=document.getElementById('cfg-txt-area');
    const inc=parseItensTxt(ta.value);
    if(!inc.length){ alert('Nenhum bloco ITEM encontrado no texto.'); return; }
    fecharCfg();
    mgAbrir(inc, 'txt', 'texto colado', []);
}

// ---- Plano de mudanças ----
function mgPlano() {
    const conhecidas=new Set(coms.map(c=>c.sigla));
    const atuais=cong.filter(e=>e.t==='item').map(e=>getItem(e.iid)).filter(Boolean);
    const usados=new Set();
    const novos=[], alt=[]; let iguais=0;
    const vistos=new Set();
    mg.inc.forEach((o,idx)=>{
        const dup=(o.key||'#'+o.num)+'|'+o.num;
        if(vistos.has(dup)) return;          // mesmo item em dois arquivos
        vistos.add(dup);
        const it = o.key
            ? atuais.find(a=>!usados.has(a.id) && itemKey(a)===o.key)
            : atuais.find(a=>!usados.has(a.id) && !itemKey(a) && a.num===o.num);
        if(!it){ novos.push({ idx, o }); return; }
        usados.add(it.id);
        let addC=[], rmC=[];
        if(o.cAtv){
            const inc=o.cAtv.filter(s=>conhecidas.has(s));
            addC=inc.filter(s=>!it.cAtv.includes(s));
            rmC=it.cAtv.filter(s=>!inc.includes(s));
        }
        let tit=it.tit, desc=it.desc;
        if(mg.src==='pdf'){
            // do PDF não vem título resumido: preserva o que já existe, só acerta o número e preenche vazios
            if(itemPlaceholder(it)) tit=titPdf(o, it.pe);
            else if(!it.pe && o.num!=null) tit=it.tit.replace(/^Item\s+\d+\s+-\s+/, 'Item '+o.num+' - ');
            if(!it.desc) desc=descPdf(o);
        } else {
            if(o.tit) tit=o.tit;
            if(o.desc) desc=o.desc;
        }
        const mTit=tit!==it.tit, mDesc=desc!==it.desc;
        if(addC.length||rmC.length||mTit||mDesc) alt.push({ idx, o, it, addC, rmC, tit, desc, mTit, mDesc });
        else iguais++;
    });
    // itens da pauta atual que não vieram na lista (só faz sentido se a lista recebida é a completa)
    const temPe=mg.inc.some(o=>o.pe);
    const fora=atuais.filter(a=>!usados.has(a.id) && (itemKey(a)||a.cAtv.length) && (temPe||!a.pe));
    const desconh=[...new Set(mg.inc.flatMap(o=>o.cAtv||[]).filter(s=>!conhecidas.has(s)))];
    return { novos, alt, fora, iguais, desconh };
}

function mgAbrir(inc, src, fonte, avisos) {
    mg={ inc, src, fonte, avisos, full:false, pe:false, on:new Set() };
    const p=mgPlano();
    const nAtuais=cong.filter(e=>e.t==='item').length;
    // Palpite do tipo de arquivo (o usuário pode trocar no diálogo)
    const casados=p.alt.length+p.iguais;
    const comecou=cong.some(e=>{ if(e.t!=='item') return false; const it=getItem(e.iid); return it&&it.apregoado; });
    let tipo, motivo;
    if(nAtuais===0){ tipo='lista'; motivo='a pauta do app está vazia'; }
    else if(src==='pdf' && inc.every(o=>o.num==null)){ tipo='pes'; motivo='este PDF não traz "ITEM NA PAUTA n", como os PDFs de pé de pauta'; }
    else if(casados>=nAtuais/2){ tipo='lista'; motivo=casados+' dos '+nAtuais+' itens que estão no app aparecem neste arquivo'; }
    else if(src==='pdf' && comecou){ tipo='pes'; motivo='o congresso já começou e quase nada deste arquivo está na pauta'; }
    else { tipo='mais'; motivo='quase nada deste arquivo está na pauta do app'; }
    mg.motivo=motivo; mg.palpite=tipo;
    mgSetTipo(tipo);
    p.novos.forEach(n=>mg.on.add('n'+n.idx));
    // mudança de comissão em item já apregoado fica desmarcada por padrão (mexe em votação em curso)
    p.alt.forEach(a=>{ if(!(a.it.apregoado && (a.addC.length||a.rmC.length))) mg.on.add('a'+a.idx); });
    document.getElementById('modal-mg').classList.add('show');
    mgRender();
}
function mgFechar() { document.getElementById('modal-mg').classList.remove('show'); mg=null; }
function mgTog(k) { if(mg.on.has(k)) mg.on.delete(k); else mg.on.add(k); mgRender(); }
// Tipo do arquivo recebido: 'lista' (pauta inteira, versão nova) | 'pes' (pés de pauta) | 'mais' (itens avulsos a acrescentar)
function mgSetTipo(t) { mg.tipo=t; mg.full=(t==='lista'); mg.pe=(t==='pes'); }
function mgTipo(t) { mgSetTipo(t); mgRender(); }

function mgRender() {
    if(!mg) return;
    const p=mgPlano();
    const chk=(k)=>'<input type="checkbox" '+(mg.on.has(k)?'checked':'')+' onchange="mgTog(\''+k+'\')">';
    let h='<p class="hint">Fonte: '+esc(mg.fonte)+' — '+mg.inc.length+' item(ns) lido(s). Presenças, votos, ordem e composição das comissões não são alterados.</p>';
    const tipos=[
        ['lista','Lista atualizada do Congresso','É a pauta inteira, numa versão mais nova. Além dos novos e alterados, mostro os itens que estão no app e sumiram desta lista, para você decidir se retira.'],
        ['pes','Pés de pauta','São itens extras que chegaram depois. Os novos entram no fim com a etiqueta PÉ. O que já está na pauta e não aparece neste arquivo fica como está.'],
        ['mais','Outros itens a acrescentar','Lista parcial que não é pé de pauta (ex.: substitutivos). Os novos entram no fim como itens comuns. O que não aparece neste arquivo fica como está.']
    ].filter(t=>mg.src==='pdf'||t[0]!=='pes');   // no texto de importação, os pés já vêm marcados
    h+='<div class="mg-opts"><div class="mg-q">O que é este arquivo?</div>';
    tipos.forEach(t=>{
        h+='<label class="mg-tipo'+(mg.tipo===t[0]?' on':'')+'"><input type="radio" name="mg-tipo" '+(mg.tipo===t[0]?'checked':'')+' onchange="mgTipo(\''+t[0]+'\')">' +
           '<span><b>'+t[1]+'</b>'+(mg.palpite===t[0]?' <span class="mg-palp">sugerido</span>':'')+'<br><span class="mg-d">'+t[2]+'</span></span></label>';
    });
    h+='<div class="mg-d">Sugestão automática porque '+esc(mg.motivo)+'. Troque se não for o caso.</div></div>';
    mg.avisos.forEach(a=>{ h+='<div class="mg-warn">'+esc(a)+'</div>'; });
    if(p.desconh.length) h+='<div class="mg-warn">Sigla(s) de comissão que não existem na composição atual, ignoradas: '+esc(p.desconh.join(', '))+'</div>';

    if(p.novos.length){
        h+='<div class="mg-sec"><h4>Novos ('+p.novos.length+') — desmarque o que não deve entrar</h4>';
        p.novos.forEach(n=>{
            const o=n.o, pe=o.pe||mg.pe;
            const tit=mg.src==='pdf'?titPdf(o,pe):(o.tit||'Item '+o.num);
            h+='<label class="mg-li">'+chk('n'+n.idx)+'<span><span class="mg-t">'+esc(tit)+'</span>'+(pe?' <span class="badge-pe">PÉ</span>':'') +
               '<br><span class="mg-d">Comissões: '+esc((o.cAtv&&o.cAtv.length)?o.cAtv.join(', '):'não identificadas')+'</span></span></label>';
        });
        h+='</div>';
    }
    if(p.alt.length){
        h+='<div class="mg-sec"><h4>Alterados ('+p.alt.length+') — desmarque para manter como está no app</h4>';
        p.alt.forEach(a=>{
            let d=[];
            if(a.addC.length) d.push('<span class="mg-add">+ '+esc(a.addC.join(', '))+'</span>');
            if(a.rmC.length) d.push('<span class="mg-rm">− '+esc(a.rmC.join(', '))+'</span>');
            if(a.mTit) d.push('título → '+esc(a.tit));
            if(a.mDesc) d.push('descrição atualizada');
            const votado=a.it.apregoado&&(a.addC.length||a.rmC.length);
            h+='<label class="mg-li">'+chk('a'+a.idx)+'<span><span class="mg-t">'+esc(a.it.tit)+'</span>' +
               '<br><span class="mg-d">'+d.join(' &middot; ')+(votado?' &middot; <b>já apregoado</b> — tirar comissão apaga os votos dela':'')+'</span></span></label>';
        });
        h+='</div>';
    }
    if(mg.full && p.fora.length){
        h+='<div class="mg-sec"><h4>Saíram da lista ('+p.fora.length+') — marque para retirar do Congresso</h4>';
        p.fora.forEach(it=>{
            h+='<label class="mg-li">'+chk('f'+it.id)+'<span><span class="mg-t">'+esc(it.tit)+'</span>' +
               (it.apregoado?'<br><span class="mg-d"><b>já apregoado</b></span>':'')+'</span></label>';
        });
        h+='<p class="hint" style="margin-top:4px">Retirar só tira o item da ordem do Congresso; ele continua na aba Itens, com os dados.</p></div>';
    }
    if(!p.novos.length && !p.alt.length && !(mg.full&&p.fora.length)){
        h+='<p class="mg-none">Nada a mudar: a pauta já está igual a esta lista.</p>';
    } else if(p.iguais){
        h+='<p class="hint" style="margin-top:10px">'+p.iguais+' item(ns) sem mudança.</p>';
    }
    document.getElementById('mgbody').innerHTML=h;
}

// Item para receber um projeto novo: reaproveita o "Item n" vazio de mesmo número, se estiver livre
function mgNovoItem(num) {
    let it = num!=null ? itens.find(x=>x.id==='i-'+num) : null;
    if(it && (isSel(it.id) || !itemPlaceholder(it) || it.cAtv.length || it.desc)) it=null;
    if(!it){
        const livre = num!=null && !itens.some(x=>x.id==='i-'+num);
        const n = livre ? num : nItem++;
        it=mkItem(n); itens.push(it);
        if(n>=nItem) nItem=n+1;
    }
    return it;
}

function mgAplicar() {
    if(!mg) return;
    const p=mgPlano();
    const conhecidas=new Set(coms.map(c=>c.sigla));
    let nNov=0, nAlt=0, nFora=0;
    p.alt.forEach(a=>{
        if(!mg.on.has('a'+a.idx)) return;
        const it=a.it;
        it.tit=a.tit; it.desc=a.desc;
        a.addC.forEach(s=>{ it.cAtv.push(s); it.votos[s]={}; });
        a.rmC.forEach(s=>{ it.cAtv.splice(it.cAtv.indexOf(s),1); delete it.votos[s]; });
        nAlt++;
    });
    p.novos.forEach(n=>{
        if(!mg.on.has('n'+n.idx)) return;
        const o=n.o, pe=o.pe||mg.pe;
        const it=mgNovoItem(o.num);
        it.pe=pe;
        // PDF de pés de pauta não traz número: numera como o "+ Pé de Pauta" (Pé 1, Pé 2…)
        const numTit = o.num!=null ? o.num : (it.num>100 ? it.num-100 : null);
        it.tit = mg.src==='pdf' ? titPdf(Object.assign({}, o, {num:numTit}), pe) : (o.tit||it.tit);
        it.desc = mg.src==='pdf' ? descPdf(o) : (o.desc||'');
        it.cAtv=(o.cAtv||[]).filter(s=>conhecidas.has(s));
        it.votos={}; it.cAtv.forEach(s=>{ it.votos[s]={}; });
        cong.push({t:'item', iid:it.id});
        nNov++;
    });
    if(mg.full) p.fora.forEach(it=>{
        if(!mg.on.has('f'+it.id)) return;
        cong=cong.filter(e=>!(e.t==='item'&&e.iid===it.id));
        if(selId===it.id) selId=null;
        nFora++;
    });
    if(nNov||nAlt||nFora){
        const d=new Date();
        const hora=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
        notas=(notas?notas+'\n':'')+'Pauta atualizada ('+hora+', '+mg.fonte+'): '+nNov+' novo(s), '+nAlt+' alterado(s), '+nFora+' retirado(s)';
    }
    mgFechar();
    save(); render();
}

// ---- Arrastar arquivo para a janela ----
function dropEvents() {
    const ov=document.getElementById('drop-ov');
    const temArq=e=>e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
    let n=0;
    window.addEventListener('dragenter',e=>{ if(!temArq(e)) return; e.preventDefault(); n++; ov.classList.add('show'); });
    window.addEventListener('dragover',e=>{ if(temArq(e)) e.preventDefault(); });
    window.addEventListener('dragleave',e=>{ if(!temArq(e)) return; n=Math.max(0,n-1); if(!n) ov.classList.remove('show'); });
    window.addEventListener('drop',e=>{
        if(!temArq(e)) return;
        e.preventDefault(); n=0; ov.classList.remove('show');
        atlArquivos(e.dataTransfer.files);
    });
}

// ========== NOVO ==========
function novo() {
    if(!confirm('Limpar todos os dados?')) return;
    localStorage.removeItem('cong-cmsp');
    location.reload();
}

// ========== DRAG AND DROP ==========
let dragState = null;

function onDragStart(e) {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const ent = handle.closest('.ent');
    if (!ent || ent.dataset.idx == null) return;
    e.preventDefault();
    const idx = parseInt(ent.dataset.idx);
    dragState = { idx, targetIdx: idx };
    ent.classList.add('dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
    if (!dragState) return;
    e.preventDefault();
    const lst = document.getElementById('l-cong');
    const entries = [...lst.querySelectorAll('.ent')];
    lst.querySelectorAll('.drag-line').forEach(l => l.remove());

    let targetIdx = cong.length;
    for (let i = 0; i < entries.length; i++) {
        const rect = entries[i].getBoundingClientRect();
        if (e.clientY < rect.top + rect.height / 2) {
            targetIdx = parseInt(entries[i].dataset.idx);
            entries[i].insertAdjacentHTML('beforebegin', '<div class="drag-line"></div>');
            dragState.targetIdx = targetIdx;
            autoScroll(lst, e.clientY);
            return;
        }
    }
    if (entries.length > 0) {
        entries[entries.length - 1].insertAdjacentHTML('afterend', '<div class="drag-line"></div>');
    }
    dragState.targetIdx = targetIdx;
    autoScroll(lst, e.clientY);
}

function autoScroll(lst, y) {
    const r = lst.getBoundingClientRect();
    if (y < r.top + 30) lst.scrollTop -= 10;
    else if (y > r.bottom - 30) lst.scrollTop += 10;
}

function onDragEnd() {
    if (!dragState) return;
    const lst = document.getElementById('l-cong');
    lst.querySelectorAll('.drag-line').forEach(l => l.remove());
    const d = lst.querySelector('.ent.dragging');
    if (d) d.classList.remove('dragging');
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);

    const { idx, targetIdx } = dragState;
    dragState = null;
    if (targetIdx !== idx && targetIdx !== idx + 1) {
        const [item] = cong.splice(idx, 1);
        const insertAt = targetIdx > idx ? targetIdx - 1 : targetIdx;
        cong.splice(insertAt, 0, item);
        save(); render();
    }
}

// ========== UTIL ==========
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function ea(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ========== EVENTOS ==========
function events() {
    document.querySelectorAll('.tabs button').forEach(b=>{
        b.addEventListener('click',()=>{ aTab=b.dataset.tab; save(); renderTabs(); });
    });
    document.getElementById('busca').addEventListener('input',e=>{ filtro=e.target.value; renderItens(); });
    document.getElementById('anotacoes').addEventListener('input',e=>{ notas=e.target.value; save(); });
    document.getElementById('bt-play').addEventListener('click', playTm);
    document.getElementById('bt-pause').addEventListener('click', pauseTm);
    document.getElementById('bt-reset').addEventListener('click', resetTm);
    document.getElementById('bt-pres').addEventListener('click', addPres);
    document.getElementById('bt-pe').addEventListener('click', addPe);
    document.getElementById('bt-sep').addEventListener('click', addSep);
    document.getElementById('bt-atl').addEventListener('click',()=>document.getElementById('in-atl').click());
    document.getElementById('in-atl').addEventListener('change',e=>{ atlArquivos(e.target.files); e.target.value=''; });
    document.getElementById('modal-mg').addEventListener('click',e=>{ if(e.target===e.currentTarget) mgFechar(); });
    dropEvents();
    document.getElementById('bt-cfg').addEventListener('click', abrirCfg);
    document.getElementById('bt-mx').addEventListener('click', e=>{ e.currentTarget.blur(); toggleMatriz(); });
    document.addEventListener('keydown', mxTecla);
    // o Espaço "clica" o botão em foco ao soltar a tecla; na visão geral ele é do apregoar
    document.addEventListener('keyup', e=>{ if(visao==='mx' && e.key===' ' && e.target && e.target.tagName==='BUTTON' && !document.querySelector('.modal.show')) e.preventDefault(); });
    document.getElementById('bt-novo').addEventListener('click', novo);
    document.getElementById('bt-menu').addEventListener('click', togMenu);
    document.getElementById('side-backdrop').addEventListener('click', closeMenu);
    document.getElementById('modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) fecharCfg(); });
    document.getElementById('l-cong').addEventListener('pointerdown', onDragStart);
}
