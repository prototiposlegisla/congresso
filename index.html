<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congresso de Comissões</title>
    <style>
        :root {
            --pri: #1e3a5f; --accent: #2b6cb0; --ok: #276749; --ok-bg: #c6f6d5;
            --nok: #c53030; --nok-bg: #fed7d7; --warn: #b7791f; --warn-bg: #fefcbf;
            --bg: #f0f4f8; --card: #fff; --brd: #d2d6dc; --txt: #1a202c; --txt2: #718096;
            --hdr: 48px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; overflow:hidden; }
        button { cursor:pointer; font-family:inherit; font-size:inherit; }
        input,textarea { font-family:inherit; font-size:inherit; }

        /* HEADER */
        .hdr { display:flex; align-items:center; height:var(--hdr); padding:0 8px; background:var(--pri); color:#fff; flex-shrink:0; gap:8px; }
        .hdr h1 { font-size:14px; font-weight:600; white-space:nowrap; }
        .timer { display:flex; align-items:center; gap:4px; margin-left:auto; }
        #tm { font-family:Consolas,"Courier New",monospace; font-size:20px; font-weight:700; }
        .timer button, .hdr-btn { background:rgba(255,255,255,.15); border:none; color:#fff; min-width:32px; height:32px; border-radius:4px; font-size:13px; padding:0 8px; }
        .timer button:hover, .hdr-btn:hover { background:rgba(255,255,255,.3); }
        .timer button:disabled { opacity:.35; }
        .tm-w { color:#fbd38d!important; }
        .tm-d { color:#feb2b2!important; }

        /* APP */
        .app { display:flex; flex:1; overflow:hidden; }

        /* SIDEBAR */
        .side { width:100%; max-width:400px; border-right:1px solid var(--brd); display:flex; flex-direction:column; background:#fff; flex-shrink:0; }
        .tabs { display:flex; border-bottom:1px solid var(--brd); }
        .tabs button { flex:1; padding:8px; border:none; background:none; font-size:13px; font-weight:600; color:var(--txt2); border-bottom:2px solid transparent; }
        .tabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
        .tbar { padding:6px 8px; border-bottom:1px solid var(--brd); display:flex; flex-wrap:wrap; gap:4px; }
        .tbar button { background:var(--bg); border:1px solid var(--brd); padding:6px 10px; border-radius:4px; font-size:12px; color:var(--txt); }
        .tbar button:hover { background:#e2e8f0; }
        .tbar input { flex:1; min-width:80px; padding:6px 8px; border:1px solid var(--brd); border-radius:4px; font-size:13px; }
        .stats { padding:3px 8px; font-size:11px; color:var(--txt2); background:#f7fafc; border-bottom:1px solid var(--brd); }
        .tcont { display:none; flex-direction:column; flex:1; overflow:hidden; }
        .tcont.on { display:flex; }
        .lst { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

        /* SIDEBAR SPLIT + NOTAS */
        .side-top { flex:4; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
        .side-notes { flex:1; display:flex; flex-direction:column; min-height:0; border-top:2px solid var(--brd); background:#f7fafc; }
        .side-notes label { font-size:11px; font-weight:600; color:var(--txt2); text-transform:uppercase; padding:5px 8px 2px; flex-shrink:0; }
        .side-notes textarea { flex:1; width:100%; border:none; resize:none; padding:4px 8px 8px; font-size:13px; background:transparent; outline:none; font-family:inherit; line-height:1.4; }

        /* ENTRIES */
        .ent { display:flex; align-items:center; padding:8px; border-bottom:1px solid #edf2f7; cursor:pointer; font-size:13px; gap:6px; min-height:44px; }
        .ent:active { background:#ebf4ff; }
        .ent.sel { box-shadow:inset -5px 0 0 var(--accent); }
        .ent.pres { background:#1a202c; color:#fff; font-weight:600; font-size:12px; }
        .ent.pres .et { text-align:center; }
        .ent.pres .drag-handle { color:#4a5568; }
        .ent.pres .drag-handle:hover { color:#a0aec0; }
        .ent.pres .bi { color:#cbd5e0; }
        .ent.pres .bi:hover { background:rgba(255,255,255,.15); color:#fff; }
        .ent.pres.sel { box-shadow:inset -5px 0 0 #f6ad55; }
        /* Prévia de presenças: listras âmbar = "ainda não vale" */
        .ent.pres.prev, .mx tr.pr.prev td { background:repeating-linear-gradient(135deg,#1a202c 0 10px,#3d3413 10px 20px); }
        .badge-prev { display:inline-block; background:#f6c343; color:#3a2c00; font-size:10px; font-weight:700; padding:1px 6px; border-radius:3px; letter-spacing:.04em; vertical-align:middle; }
        #bt-prev-hdr { background:#f6c343; color:#3a2c00; border-color:#f6c343; font-weight:700; }
        .det.em-prev { outline:2px dashed #d69e2e; outline-offset:6px; border-radius:4px; }
        .prev-box { background:repeating-linear-gradient(135deg,#fff8dc 0 12px,#fdf0bf 12px 24px); border:1px solid #d69e2e; border-radius:6px; padding:10px 12px; margin-bottom:10px; font-size:13px; line-height:1.45; color:#3a2c00; }
        .prev-tr { margin-top:8px; font-weight:600; }
        .prev-tr div { display:flex; gap:8px; align-items:center; font-weight:400; margin-top:3px; }
        .prev-tr button { border:1px solid #b7892a; background:#fff; border-radius:4px; font-size:11px; padding:2px 8px; cursor:pointer; }
        .prev-sg { display:block !important; font-weight:400; margin-top:5px; }
        .prev-sg small { opacity:.7; font-size:10px; }
        .prev-sg div { flex-wrap:wrap; }
        .pc.vistos { margin-top:8px; }
        .bt-limpa { margin-left:8px; padding:3px 10px; border:1px solid var(--brd); border-radius:4px; background:#fff; font-size:12px; cursor:pointer; }
        .vg { display:flex; flex-wrap:wrap; gap:6px 14px; }
        .vgp { display:flex; flex-wrap:wrap; gap:3px; align-items:center; }
        .vpt { font-size:11px; font-weight:700; color:var(--txt2); min-width:34px; }
        .vgp .mc { min-height:30px; padding:2px 6px; font-size:12px; }
        .prev-ac { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
        .prev-ac button { padding:6px 12px; border:1px solid #b7892a; border-radius:4px; font-size:12px; background:#fff; min-height:34px; cursor:pointer; color:#3a2c00; }
        .prev-ac button.pri { background:#276749; border-color:#276749; color:#fff; font-weight:600; }
        .pa button.bt-prev { border-color:#d69e2e; background:#fffbea; }
        .pa button.bt-prev:disabled { opacity:.5; }
        .ent.sep { background:var(--accent); color:#fff; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.5px; border-top:3px solid var(--pri); }
        .ent.sep .et { text-align:center; }
        .ent.sep .drag-handle { color:#bee3f8; }
        .ent.sep .bi { color:#bee3f8; }
        .ent.sep .bi:hover { background:rgba(255,255,255,.15); color:#fff; }
        .ent.sep.sel { box-shadow:inset -5px 0 0 #f6ad55; }
        .ent.nvotavel { background:#f1f5f9; color:#8899a8; }
        .ent.sem-com { background:#f1f5f9; color:#8899a8; }
        .badge-res { font-size:14px; font-weight:700; flex-shrink:0; line-height:1; }
        .badge-res.ok { color:var(--ok); }
        .badge-res.no { color:var(--nok); }
        .badge-res.pe { color:var(--warn); }
        .ent .chk { flex-shrink:0; width:18px; height:18px; }
        .ent .et { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .badge-pe { background:#fbd38d; color:#744210; font-size:10px; padding:1px 5px; border-radius:3px; font-weight:600; flex-shrink:0; }
        .badge-c { font-size:10px; color:var(--txt2); flex-shrink:0; }
        .bi { background:none; border:none; padding:4px; font-size:14px; border-radius:4px; color:var(--txt2); min-width:28px; min-height:28px; }
        .bi:hover { background:#e2e8f0; }
        .bi.rm:hover { background:var(--nok-bg); color:var(--nok); }

        /* DRAG AND DROP */
        .drag-handle { cursor:grab; padding:4px 2px; font-size:15px; color:var(--brd); user-select:none; touch-action:none; flex-shrink:0; line-height:1; }
        .drag-handle:hover { color:var(--txt2); }
        .ent.dragging { opacity:0.2; }
        .drag-line { height:2px; background:var(--accent); border-radius:1px; pointer-events:none; }

        /* MAIN */
        .main { flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; display:none; transition:background .25s; }
        .main.on { display:block; }
        .main.st-ok { background:#e9fbf0; }
        .main.st-no { background:#fdecec; }
        .main.st-pe { background:#fdfae3; }
        .ph { color:var(--txt2); text-align:center; margin-top:60px; font-size:14px; }
        .det h2 { font-size:17px; margin-bottom:10px; }
        .det h3 { font-size:13px; margin:14px 0 6px; color:var(--pri); text-transform:uppercase; }
        .hint { font-size:12px; color:var(--txt2); margin-bottom:8px; }
        .imeta { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
        .imeta label { display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; }
        .fg { margin-bottom:10px; }
        .fg label { display:block; font-size:11px; font-weight:600; margin-bottom:2px; color:var(--txt2); text-transform:uppercase; }
        .fg input, .fg textarea { width:100%; padding:6px 8px; border:1px solid var(--brd); border-radius:4px; font-size:13px; }
        .fg textarea { resize:vertical; }

        /* COMISSAO CARDS */
        .cc { border:1px solid var(--brd); border-radius:6px; margin-bottom:6px; overflow:hidden; transition:border-color .2s; }
        .cc.off { opacity:.5; }
        .cc.st-ok { border-color:var(--ok); background:#e9fbf0; }
        .cc.st-ok .cch { background:var(--ok-bg); }
        .cc.st-no { border-color:var(--nok); background:#fdecec; }
        .cc.st-no .cch { background:var(--nok-bg); }
        .cc.st-pe { border-color:var(--warn); background:#fdfae3; }
        .cc.st-pe .cch { background:var(--warn-bg); }
        .cch { display:flex; align-items:center; gap:6px; padding:8px; background:#f7fafc; font-size:13px; cursor:pointer; }
        .cch label { display:flex; align-items:center; gap:5px; cursor:pointer; flex:1; font-weight:600; }
        .cch .cnm { font-weight:400; font-size:11px; color:var(--txt2); }
        .ccb { padding:8px; display:none; }
        .cc.ativo .ccb { display:block; }
        .qb { display:inline-block; font-size:10px; padding:1px 6px; border-radius:8px; font-weight:600; white-space:nowrap; }
        .qok { background:var(--ok-bg); color:var(--ok); }
        .qno { background:var(--nok-bg); color:var(--nok); }

        /* MEMBER VOTES */
        .mv { display:flex; flex-wrap:wrap; gap:3px; }
        .mr { display:flex; align-items:center; gap:4px; padding:3px 6px; border-radius:4px; font-size:12px; background:#f7fafc; border:1px solid #edf2f7; min-height:32px; }
        .mr.ausente { opacity:.35; }
        .mr .vb { min-width:28px; height:24px; border:1px solid var(--brd); border-radius:3px; font-size:10px; font-weight:700; background:#fff; }
        .mr .vb.sim { background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
        .mr .vb.nao { background:var(--nok-bg); color:var(--nok); border-color:var(--nok); }
        .mr .vb.abst { background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }
        .mr .vb.nada { background:#fff; color:var(--txt2); border-color:var(--brd); }

        /* PRESENCE DETAIL */
        .pc { border:1px solid var(--brd); border-radius:6px; margin-bottom:8px; overflow:hidden; transition:border-color .2s; }
        .pc.st-ok { border-color:var(--ok); background:#e9fbf0; }
        .pc.st-ok .pch { background:var(--ok-bg); }
        .pc.st-no { border-color:var(--nok); background:#fdecec; }
        .pc.st-no .pch { background:var(--nok-bg); }
        .pch { display:flex; justify-content:space-between; align-items:center; padding:8px; background:#f7fafc; font-size:13px; font-weight:600; }
        .pcb { padding:8px; }
        .mg { display:flex; flex-wrap:wrap; gap:3px; }
        .mc { display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; padding:4px 6px; border-radius:4px; background:#f7fafc; border:1px solid #edf2f7; min-height:36px; }
        .mc input { width:17px; height:17px; }
        .mc.herd { background:#e6effb; border-color:#a9c7ec; }
        .mc.nova { background:var(--ok-bg); border-color:var(--ok); }
        .lg-herd { color:#3a6ea5; font-weight:600; }
        .lg-nova { color:var(--ok); font-weight:600; }
        .pa { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
        .pa button { padding:6px 10px; border:1px solid var(--brd); border-radius:4px; font-size:12px; background:#fff; min-height:36px; }

        /* BARRA DE QUÓRUM: preenchimento = presentes; traço = quórum */
        /* Barra de quórum: uma casa por membro; a mais alta é a cadeira-chave (a que completa o quórum) */
        .qbar { flex:1; min-width:30px; display:flex; gap:2px; align-items:center; }
        .qbar i { flex:1; height:8px; border-radius:2px; background:rgba(0,0,0,.13); display:block; }
        .qbar i.key { height:15px; border-radius:3px; }
        .qbar i.on { background:var(--nok); }
        .qbar.ok i.on { background:var(--ok); }
        .qbar i.falta { background:transparent; box-shadow:inset 0 0 0 1.5px var(--nok); }
        .pch { gap:8px; }

        /* COMISSÕES EM COLUNAS (presença e item) */
        .cgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; align-items:start; }
        .cgrid .cc, .cgrid .pc { margin-bottom:0; }
        .cgrid .mv, .cgrid .mg { flex-direction:column; flex-wrap:nowrap; }
        .cgrid .mc .swap { margin-left:auto; }
        .cgrid .cnm { display:none; }
        .cgrid .cch label { flex:0 0 auto; }
        .cc-offs { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin-top:8px; font-size:12px; color:var(--txt2); }
        .cc-offs label { display:flex; gap:4px; align-items:center; cursor:pointer; font-weight:600; color:var(--txt); }

        /* VISÃO GERAL (matriz itens × comissões) */
        .hdr-btn.ativo { background:#fff; color:var(--pri); }
        .mx-wrap { background:#fff; border:1px solid var(--brd); border-radius:6px; overflow:auto; max-height:calc(100vh - var(--hdr) - 110px); }
        .mx { border-collapse:collapse; width:100%; font-size:13px; }
        .mx th { position:sticky; top:0; background:#fff; z-index:1; box-shadow:inset 0 -2px 0 var(--pri); padding:7px 8px; text-align:center; font-size:12px; color:var(--pri); }
        .mx th.t { text-align:left; }
        .mx td { border-bottom:1px solid #edf2f7; padding:0 6px; height:34px; text-align:center; }
        .mx td.t { text-align:left; max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 10px; }
        .mx td.c { width:84px; border-left:1px solid #edf2f7; font-size:12px; }
        .mx td.s { width:120px; white-space:nowrap; font-size:11px; font-weight:700; }
        .mx tbody tr { cursor:pointer; }
        .mx tr.it:hover td.t, .mx tr.it:hover td.s { background:#ebf4ff; }
        .mx tr.sel td.t { box-shadow:inset 5px 0 0 var(--accent); font-weight:600; }
        .mx td.ok { background:var(--ok-bg); color:var(--ok); font-weight:700; font-size:15px; }
        .mx td.no { background:var(--nok-bg); color:var(--nok); font-weight:700; font-size:15px; }
        .mx td.pe { background:var(--warn-bg); color:var(--warn); }
        .mx td.q { color:var(--ok); font-size:15px; }
        .mx td.f { color:var(--nok); font-weight:600; background:repeating-linear-gradient(135deg,#fff,#fff 5px,#fdecec 5px,#fdecec 10px); }
        .mx td.s.ok, .mx td.s.no, .mx td.s.pe { font-size:11px; }
        .mx td.s.pronto { color:var(--accent); }
        .mx td.s.bloq { color:var(--txt2); }
        .mx tr.pr td { background:#1a202c; color:#fff; font-weight:600; border-bottom-color:#1a202c; }
        .mx tr.pr td.c { font-size:11px; padding:5px 8px; }
        .mx tr.pr td.c.dim { opacity:.35; }
        .mx tr.pr .qbar { margin-top:3px; }
        .mx tr.pr .qbar i { background:rgba(255,255,255,.22); }
        .mx tr.pr .qbar i.on { background:#fc8181; }
        .mx tr.pr .qbar.ok i.on { background:#68d391; }
        .mx tr.pr .qbar i.falta { background:transparent; box-shadow:inset 0 0 0 1.5px #fc8181; }
        /* mesma simbologia do resto do app: linha esmaecida sem quórum, fundo pelo resultado */
        .mx tr { scroll-margin-top:40px; scroll-margin-bottom:8px; }
        .mx tr.it.st-ok > td { background:#e9fbf0; }
        .mx tr.it.st-no > td { background:#fdecec; }
        .mx tr.it.st-pe > td { background:#fdfae3; }
        .mx tr.it.nvot > td { background:#f1f5f9; color:#8899a8; }
        .mx tr.it > td.ok { background:var(--ok-bg); }
        .mx tr.it > td.no { background:var(--nok-bg); }
        .mx tr.it > td.pe { background:var(--warn-bg); }
        .mx tr.it.nvot > td.f { background:#f1f5f9; color:#cf8f8f; }
        .mx tr.it.nvot > td.q { color:#9bbfa9; }
        .mx tr.sel > td { box-shadow:inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
        .mx tr.sel > td.t { box-shadow:inset 5px 0 0 var(--accent), inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
        .mx td.t .badge-res { margin-right:6px; }
        .mx tr.sp td { background:var(--accent); color:#fff; font-weight:700; text-transform:uppercase; letter-spacing:.5px; font-size:12px; height:28px; }

        /* NAV BUTTONS */
        .nav-bar { display:flex; gap:6px; margin-bottom:12px; }
        .nav-btn { flex:1; display:flex; align-items:center; gap:6px; padding:10px 14px; border:1px solid var(--brd); border-radius:6px; background:#fff; font-size:13px; color:var(--txt); min-height:48px; transition:background .15s; }
        .nav-btn:hover:not(:disabled) { background:#ebf4ff; border-color:var(--accent); }
        .nav-btn:disabled { opacity:.3; cursor:default; }
        .nav-btn .nav-arrow { font-size:20px; font-weight:700; color:var(--accent); flex-shrink:0; }
        .nav-btn .nav-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .nav-btn.next { justify-content:flex-end; text-align:right; }

        /* RESULT */
        .res { border:1px solid var(--brd); border-radius:6px; padding:10px; margin-top:10px; }
        .res h3 { margin-top:0; }
        .rs { font-size:14px; font-weight:700; margin-top:4px; }
        .rs.ok { color:var(--ok); }
        .rs.no { color:var(--nok); }
        .rs.pe { color:var(--warn); }

        /* VOTAÇÃO SIMBÓLICA */
        .sv { border:1px solid var(--brd); border-radius:6px; padding:10px; margin-bottom:14px; background:#fff; }
        .sv h3 { margin:0 0 8px; }
        .sv-hint { font-weight:400; font-size:10px; color:var(--txt2); text-transform:none; }
        .sv-bar { position:relative; display:flex; gap:6px; align-items:stretch; }
        .sv-input { flex:1; padding:10px 12px; border:1px solid var(--brd); border-radius:6px; font-size:15px; }
        .sv-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(43,108,176,.2); }
        .sv-mode { display:flex; align-items:center; gap:5px; padding:0 12px; border:1px solid transparent; border-radius:6px; font-size:12px; font-weight:700; white-space:nowrap; cursor:pointer; user-select:none; }
        .sv-mode:hover { filter:brightness(.96); }
        .sv-mode:active { filter:brightness(.9); }
        .sv-mode.fav { background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
        .sv-mode.contra { background:var(--nok-bg); color:var(--nok); border-color:var(--nok); }
        .sv-mode.abst { background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }
        .sv-mode .sv-caret { font-size:9px; opacity:.7; }
        .sv-sug { display:none; position:absolute; top:100%; left:0; right:0; margin-top:4px; background:#fff; border:1px solid var(--brd); border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.12); z-index:20; max-height:320px; overflow-y:auto; }
        .sv-sug.show { display:block; }
        .sv-sug-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; font-size:14px; cursor:pointer; border-bottom:1px solid #edf2f7; }
        .sv-sug-item:last-child { border-bottom:none; }
        .sv-sug-item.incom { background:#e6f7e6; }
        .sv-sug-item.active { background:#cbe7ff; }
        .sv-sug-item.incom.active { background:#7fd093; }
        .sv-sug-tag { font-size:10px; color:var(--txt2); background:rgba(0,0,0,.06); padding:1px 6px; border-radius:8px; white-space:nowrap; flex-shrink:0; }
        .sv-keys { font-size:11px; color:var(--txt2); margin:6px 0 0; }
        .sv-list { margin-top:10px; display:flex; flex-direction:column; gap:4px; }
        .sv-li { display:flex; align-items:center; gap:8px; padding:5px 8px; background:#f7fafc; border:1px solid #edf2f7; border-radius:4px; font-size:13px; }
        .sv-seq { min-width:20px; text-align:center; font-weight:700; color:var(--txt2); font-size:11px; flex-shrink:0; }
        .sv-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; white-space:nowrap; flex-shrink:0; }
        .sv-badge.fav { background:var(--ok-bg); color:var(--ok); }
        .sv-badge.contra { background:var(--nok-bg); color:var(--nok); }
        .sv-badge.abst { background:var(--warn-bg); color:var(--warn); }
        .sv-nome { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .sv-fora { font-size:10px; color:var(--warn); font-weight:600; }
        .sv-dig { font-size:11px; color:var(--txt2); font-style:italic; flex-shrink:0; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .sv-rm { background:none; border:none; color:var(--txt2); padding:2px 6px; border-radius:4px; font-size:13px; flex-shrink:0; }
        .sv-rm:hover { background:var(--nok-bg); color:var(--nok); }
        .sv-empty { font-size:12px; color:var(--txt2); margin:8px 0 0; }

        /* CARGO (presidente/vice) */
        .cargo { font-size:9px; font-weight:800; padding:1px 4px; border-radius:3px; flex-shrink:0; line-height:1.4; }
        .cargo.p { background:#fbd38d; color:#744210; }
        .cargo.v { background:#cbd5e0; color:#2d3748; }

        /* TROCA DE MEMBRO (mesmo partido) */
        .swap { width:26px; border:1px solid var(--brd); border-radius:4px; background:#fff; color:var(--txt2); font-size:12px; cursor:pointer; padding:0; height:24px; flex-shrink:0; }
        .swap:hover { border-color:var(--accent); color:var(--accent); }

        /* LINKS SPLEGIS */
        .spl-links { display:inline-flex; gap:4px; vertical-align:middle; margin-left:6px; }
        .spl-links a { font-size:10px; font-weight:700; padding:2px 7px; border:1px solid var(--brd); border-radius:4px; text-decoration:none; color:var(--accent); background:#fff; }
        .spl-links a:hover { background:#ebf4ff; border-color:var(--accent); }

        /* ABA COMISSÕES */
        .ct-hdr { display:flex; align-items:center; gap:6px; padding:7px 8px; background:var(--pri); color:#fff; font-size:12px; font-weight:700; position:sticky; top:0; z-index:1; }
        .ct-hdr .qb { margin-left:auto; }
        .ct-empty { padding:6px 8px 10px; font-size:12px; color:var(--txt2); border-bottom:1px solid #edf2f7; }

        /* LINK DO QUADRO NO HEADER */
        a.hdr-btn { display:inline-flex; align-items:center; text-decoration:none; }

        /* MODAL */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; justify-content:center; align-items:flex-start; padding:20px; overflow-y:auto; }
        .modal.show { display:flex; }
        .mcard { background:#fff; border-radius:8px; width:600px; max-width:100%; max-height:90vh; display:flex; flex-direction:column; }
        .mhdr { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid var(--brd); }
        .mhdr h2 { font-size:15px; }
        .mbody { flex:1; overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch; }
        .mftr { padding:10px 12px; border-top:1px solid var(--brd); display:flex; justify-content:flex-end; gap:6px; }
        .mftr button { padding:6px 14px; border:1px solid var(--brd); border-radius:4px; font-size:13px; background:#fff; }
        .mftr button.pri { background:var(--accent); color:#fff; border-color:var(--accent); }
        /* Atualizar pauta (mesclar) */
        .mg-opts { display:flex; flex-direction:column; gap:4px; margin:8px 0; font-size:13px; }
        .mg-q { font-weight:700; font-size:13px; color:var(--pri); }
        .mg-tipo { display:flex; gap:8px; align-items:flex-start; padding:6px 8px; border:1px solid var(--brd); border-radius:6px; cursor:pointer; }
        .mg-tipo.on { border-color:var(--accent); background:#ebf4ff; }
        .mg-tipo input { margin-top:3px; flex-shrink:0; }
        .mg-opts .mg-d { font-size:12px; color:var(--txt2); }
        .mg-palp { font-size:10px; font-weight:600; background:var(--warn-bg); color:var(--warn); padding:1px 5px; border-radius:3px; }
        .mg-sec { margin-top:12px; }
        .mg-sec h4 { font-size:12px; color:var(--pri); margin-bottom:4px; text-transform:uppercase; letter-spacing:.4px; }
        .mg-li { display:flex; gap:8px; align-items:flex-start; padding:6px 4px; border-bottom:1px solid #edf2f7; font-size:13px; }
        .mg-li input { margin-top:2px; flex-shrink:0; width:16px; height:16px; }
        .mg-li .mg-t { font-weight:600; }
        .mg-li .mg-d { font-size:12px; color:var(--txt2); }
        .mg-add { color:var(--ok); font-weight:600; }
        .mg-rm { color:var(--nok); font-weight:600; }
        .mg-warn { background:var(--warn-bg); color:var(--warn); font-size:12px; padding:5px 8px; border-radius:4px; margin-top:6px; }
        .mg-none { font-size:13px; color:var(--txt2); padding:10px 0; }
        .drop-ov { display:none; position:fixed; inset:0; z-index:200; background:rgba(43,108,176,.85); color:#fff; font-size:22px; font-weight:700; align-items:center; justify-content:center; text-align:center; padding:20px; pointer-events:none; }
        .drop-ov.show { display:flex; }
        .cfgc { margin-bottom:14px; }
        .cfgc h4 { font-size:12px; margin-bottom:4px; color:var(--pri); }
        .cfgm { display:flex; gap:4px; margin-bottom:3px; }
        .cfgm input { flex:1; padding:4px 6px; border:1px solid var(--brd); border-radius:4px; font-size:13px; }
        .addm { font-size:12px; color:var(--accent); background:none; border:none; padding:3px 0; }

        /* IMPORTAR/EXPORTAR TEXTO */
        .cfg-txt { margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--brd); }
        .cfg-txt summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--pri); padding:4px 0; user-select:none; }
        .cfg-txt textarea { width:100%; min-height:200px; padding:8px; border:1px solid var(--brd); border-radius:4px; font-size:12px; font-family:Consolas,"Courier New",monospace; resize:vertical; margin-top:6px; line-height:1.5; }
        .cfg-txt .hint { font-size:11px; color:var(--txt2); margin-top:4px; }
        .cfg-txt .btn-row { display:flex; gap:6px; margin-top:6px; }
        .cfg-txt .btn-row button { padding:5px 12px; border:1px solid var(--brd); border-radius:4px; font-size:12px; background:#fff; }
        .cfg-txt .btn-row button.pri { background:var(--accent); color:#fff; border-color:var(--accent); }
        .cfg-txt .btn-row button.pri:hover { background:#2558a0; }
        .cfg-txt .msg { font-size:12px; margin-top:4px; padding:4px 8px; border-radius:4px; display:none; }
        .cfg-txt .msg.ok { display:block; background:var(--ok-bg); color:var(--ok); }
        .cfg-txt .msg.err { display:block; background:var(--nok-bg); color:var(--nok); }

        /* HAMBURGER */
        .btn-menu { display:none; background:rgba(255,255,255,.15); border:none; color:#fff; width:32px; height:32px; border-radius:4px; font-size:18px; line-height:1; }
        .btn-menu:hover { background:rgba(255,255,255,.3); }

        /* BACKDROP */
        .side-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:49; }

        /* DESKTOP */
        @media(min-width:700px) {
            .side { width:380px; }
            .main { display:block!important; }
            .ent { min-height:34px; padding:5px 8px; }
        }
        /* MOBILE */
        @media(max-width:699px) {
            .hdr h1 { display:none; }
            .btn-menu { display:inline-block; }
            .main { display:block!important; }
            .side {
                position:fixed; top:var(--hdr); left:0; bottom:0; z-index:50;
                max-width:85vw; width:380px;
                transform:translateX(-100%); transition:transform .25s ease;
                box-shadow:2px 0 12px rgba(0,0,0,.15);
            }
            .app.side-open .side { transform:translateX(0); }
            .app.side-open .side-backdrop { display:block; }
        }
    </style>
</head>
<body>

<header class="hdr">
    <button class="btn-menu" id="bt-menu" title="Menu">&#9776;</button>
    <h1>Congresso</h1>
    <div class="timer">
        <span id="tm">75:00</span>
        <button id="bt-play" title="Iniciar">&#9654;</button>
        <button id="bt-pause" title="Pausar" disabled>&#10074;&#10074;</button>
        <button id="bt-reset" title="Reiniciar">&#8634;</button>
    </div>
    <a class="hdr-btn" href="https://www.saopaulo.sp.leg.br/atividade-legislativa/comissoes/" target="_blank" rel="noopener" title="Quadro de Composição das Comissões — site da Câmara">&#128203; Quadro</a>
    <button class="hdr-btn" id="bt-prev-hdr" style="display:none" onclick="previaIr()" title="Há uma prévia de presenças em andamento: as marcações ainda não valem. Clique para ir até ela.">&#9998; Prévia em andamento</button>
    <button class="hdr-btn" id="bt-mx" title="Visão geral: todos os itens × comissões numa tabela">&#9638; Visão geral</button>
    <button class="hdr-btn" id="bt-atl" title="Atualizar a pauta a partir de um PDF de Congresso ou do texto de importação, sem perder presenças e votos (também dá para arrastar o arquivo para cá)">&#8635; Pauta</button>
    <input type="file" id="in-atl" accept=".pdf,.md,.txt" multiple style="display:none">
    <button class="hdr-btn" id="bt-cfg">&#9881;</button>
    <button class="hdr-btn" id="bt-novo">Novo</button>
</header>

<div class="app" id="app">
    <div class="side-backdrop" id="side-backdrop"></div>
    <aside class="side">
        <div class="side-top">
            <div class="tabs">
                <button class="on" data-tab="cong">Congresso</button>
                <button data-tab="itens">Itens</button>
                <button data-tab="coms">Comissões</button>
            </div>
            <div id="t-cong" class="tcont on">
                <div class="tbar">
                    <button id="bt-pres">+ Presença</button>
                    <button id="bt-pe">+ Pé de Pauta</button>
                    <button id="bt-sep" title="Insere um separador: daqui para baixo é outro Congresso (presença e comissões convocadas recomeçam)">+ Congresso</button>
                </div>
                <div id="st-cong" class="stats"></div>
                <div id="l-cong" class="lst"></div>
            </div>
            <div id="t-itens" class="tcont">
                <div class="tbar">
                    <input type="text" id="busca" placeholder="Buscar...">
                </div>
                <div id="st-itens" class="stats"></div>
                <div id="l-itens" class="lst"></div>
            </div>
            <div id="t-coms" class="tcont">
                <div id="st-coms" class="stats"></div>
                <div id="l-coms" class="lst"></div>
            </div>
        </div>
        <div class="side-notes">
            <label for="anotacoes">Anotações</label>
            <textarea id="anotacoes" spellcheck="false" placeholder="Anotações livres sobre o Congresso…"></textarea>
        </div>
    </aside>
    <main class="main" id="main">
        <div id="det"></div>
    </main>
</div>

<div id="modal" class="modal">
    <div class="mcard">
        <div class="mhdr"><h2>Configuração</h2><button class="bi" onclick="fecharCfg()">&#10005;</button></div>
        <div class="mbody" id="cfgbody"></div>
        <div class="mftr">
            <button onclick="resetCom()">Restaurar padrão</button>
            <button class="pri" onclick="fecharCfg()">Fechar</button>
        </div>
    </div>
</div>

<div id="modal-mg" class="modal">
    <div class="mcard">
        <div class="mhdr"><h2>Atualizar pauta</h2><button class="bi" onclick="mgFechar()">&#10005;</button></div>
        <div class="mbody" id="mgbody"></div>
        <div class="mftr">
            <button onclick="mgFechar()">Cancelar</button>
            <button class="pri" id="mg-aplicar" onclick="mgAplicar()">Aplicar</button>
        </div>
    </div>
</div>
<div id="drop-ov" class="drop-ov">Solte o PDF de Congresso (ou o texto de importação) para atualizar a pauta</div>

<script>
// ========== COMISSÕES DEFAULT ==========
const COM_DEF = [
    { sigla:'CCJ', nome:'Constituição, Justiça e Legislação Participativa',
      membros:['Dr. Milton Ferreira (PODE)','Janaína Paschoal (PP)','Lucas Pavanato (PL)','Luna Zarattini (PT)','Sandra Santana (MDB)','Sansão Pereira (REPUBLICANOS)','Silvia da Bancada Feminista (PSOL)','Silvão Leite (UNIÃO)','Thammy Miranda (PSD)'] },
    { sigla:'FIN', nome:'Finanças e Orçamento',
      membros:['Alessandro Guedes (PSD)','Ana Carolina Oliveira (PODE)','André Santos (REPUBLICANOS)','Gilberto Nascimento (PL)','João Ananias (PT)','Keit Lima (PSOL)','Major Palumbo (PP)','Marcelo Messias (MDB)','Silvinho Leite (UNIÃO)'] },
    { sigla:'URB', nome:'Política Urbana, Metropolitana e Meio Ambiente',
      membros:['Danilo do Posto (PODE)','Dheison Silva (PT)','Dr. Murillo Lima (PP)','Fábio Riva (MDB)','Isac Félix (PL)','Marina Bragante (PSOL)','Rubinho Nunes (UNIÃO)'] },
    { sigla:'ADM', nome:'Administração Pública',
      membros:['Amanda Vettorazzo (UNIÃO)','Edir Sales (PSD)','Gabriel Abreu (PODE)','Jair Tatto (PT)','Professor Toninho Vespoli (PSOL)','Sargento Nantes (PP)','Zoe Martínez (PL)'] },
    { sigla:'ECON', nome:'Trânsito, Transporte e Atividade Econômica',
      membros:['Carlos Bezerra Jr. (PSD)','Kenji Ito (PODE)','Luana Alves (PSOL)','Nabil Bonduki (PT)','Dr. Sidney Cruz (MDB)','Renata Falzoni (UNIÃO)','Rute Costa (PL)'] },
    { sigla:'EDUC', nome:'Educação, Cultura e Esportes',
      membros:['Adrilles Jorge (UNIÃO)','Celso Giannazi (PSOL)','Cris Monteiro (PODE)','Eliseu Gabriel (PSB)','George Hato (MDB)','Senival Moura (PT)','Sonaira Fernandes (PL)'] },
    { sigla:'SAUDE', nome:'Saúde, Promoção Social, Trabalho e Mulher',
      membros:['Amanda Paschoal (PSOL)','Dra. Sandra Tadeu (PL)','Ely Teruel (MDB)','Hélio Rodrigues (PT)','Pastora Sandra Alves (UNIÃO)','Roberto Tripoli (PV)','Simone Ganem (PODE)'] },
];

// ========== ESTADO ==========
let coms = [];          // comissões ativas (editáveis)
let itens = [];         // todos os itens da pauta (ordem original)
let cong = [];          // ordem do congresso: [{t:'item',iid:'item-5'}, {t:'pres',pid:'p-1'}, ...]
let pres = {};          // presença: pid -> {titulo, pr:{sigla:[nomes]}}
let seps = {};          // separadores de congresso: sid -> {id, titulo}; no cong: {t:'sep',sid}
let nSep = 1;
let selId = null;       // id selecionado no congresso (iid, pid ou sid)
let aTab = 'cong';
let visao = 'det';      // painel principal: 'det' (detalhe do selecionado) | 'mx' (visão geral em matriz)
let filtro = '';
let nPres = 2;
let nItem = 101;
let notas = '';         // anotações livres sobre o Congresso
let previa = null;      // prévia de presenças em andamento: {pid, pr, herd, trocas:[{sig,ant,novo,antPres,cP,cV}]}
let tmr = { tot:75*60, rem:75*60, on:false, id:null, t0:null, el:0 };

// estado da barra de votação simbólica
let svQuery = '';       // texto digitado
let svActive = 0;       // índice da sugestão selecionada
let svVoto = 'nao';     // voto atual da barra: 'sim'|'nao'|'abst' (modos variam se nominal)
let svFocus = false;    // re-focar o input após render disparado pela barra

// ========== INIT ==========
function init() {
    if (!load()) {
        coms = JSON.parse(JSON.stringify(COM_DEF));
        for (let i=1;i<=100;i++) itens.push(mkItem(i));
        // presença inicial vazia
        const p = mkPres(1);
        pres[p.id] = p;
        cong.push({t:'pres', pid:p.id});
    }
    render();
    events();
}

function mkItem(n) {
    return { id:'i-'+n, num:n, tit:'Item '+n,
             desc:'', pe:false, apregoado:false, nominal:false, cAtv:[], votos:{}, declaracoes:[] };
}
function mkPres(n) {
    return { id:'p-'+n, num:n, titulo:'Registro de Presença #'+n, pr:{}, herd:{} };
}
function getItem(iid) { return itens.find(i=>i.id===iid); }

// ---- Separador de congressos ----
// Um separador divide a lista em congressos independentes: presença e comissões
// convocadas valem só dentro do trecho (entre um separador e o seguinte).
function congIdx(id) { return cong.findIndex(e=>congEntryId(e)===id); }
// Trecho [a,b) do congresso a que pertence a entrada idx (se for separador, o trecho que ele abre)
function segDe(idx) {
    let a=idx, b=idx+1;
    if(cong[idx].t==='sep') a=idx+1;
    else while(a>0 && cong[a-1].t!=='sep') a--;
    while(b<cong.length && cong[b].t!=='sep') b++;
    return [a,b];
}
function sepLabel(sid) {
    const s=seps[sid];
    if(s && s.titulo) return s.titulo;
    let k=1;
    for(const e of cong){ if(e.t==='sep'){ k++; if(e.sid===sid) break; } }
    return k+'º Congresso';
}
// Nome do congresso a que pertence a entrada idx
function nomeCong(idx) {
    const a=segDe(idx)[0];
    return a>0 ? sepLabel(cong[a-1].sid) : '1º Congresso';
}
// Último registro de presença antes da posição idx, sem atravessar separador
function presAntes(idx) {
    for(let i=idx-1;i>=0;i--){
        if(cong[i].t==='sep') return null;
        if(cong[i].t==='pres') return pres[cong[i].pid];
    }
    return null;
}
function isSel(iid) { return cong.some(e=>e.t==='item'&&e.iid===iid); }

// ========== PERSISTÊNCIA ==========
function save() {
    try { localStorage.setItem('cong-cmsp', JSON.stringify({coms,itens,cong,pres,seps,nSep,selId,aTab,visao,nPres,nItem,notas,previa,tmrRem:tmr.rem})); } catch(e){}
}
function load() {
    try {
        const d=JSON.parse(localStorage.getItem('cong-cmsp'));
        if(!d||!d.itens) return false;
        coms=d.coms; itens=d.itens; cong=d.cong; pres=d.pres;
        selId=d.selId; aTab=d.aTab||'cong'; visao=d.visao==='mx'?'mx':'det'; nPres=d.nPres||2; nItem=d.nItem||101;
        notas=d.notas||'';
        seps=d.seps||{}; nSep=d.nSep||1;
        previa=(d.previa&&pres[d.previa.pid])?d.previa:null;
        tmr.rem=d.tmrRem!=null?d.tmrRem:75*60;
        return true;
    } catch(e){ return false; }
}

// ========== RENDER ==========
function render() {
    renderPreviaHdr();
    renderTabs();
    renderCong();
    renderItens();
    renderComsTab();
    renderDet();
    renderTm();
    renderNotas();
}

function renderNotas() {
    const t=document.getElementById('anotacoes');
    if(t && t.value!==notas) t.value=notas;
}

function renderTabs() {
    document.querySelectorAll('.tabs button').forEach(b=>{
        b.classList.toggle('on', b.dataset.tab===aTab);
    });
    document.getElementById('t-cong').classList.toggle('on', aTab==='cong');
    document.getElementById('t-itens').classList.toggle('on', aTab==='itens');
    document.getElementById('t-coms').classList.toggle('on', aTab==='coms');
}

// ---- Aba Congresso ----
function renderCong() {
    let nIt=0, nOk=0, nNo=0;
    cong.forEach(e=>{
        if(e.t==='item'){ nIt++; const r=calcRes(getItem(e.iid)); if(r==='ok')nOk++; else if(r==='no')nNo++; }
    });
    document.getElementById('st-cong').textContent = nIt+' itens | '+nOk+' aprov | '+nNo+' rej';

    const el=document.getElementById('l-cong');
    if(!cong.length){ el.innerHTML='<div class="ph" style="margin-top:20px">Nenhum item.<br>Use "Itens" para selecionar.</div>'; return; }

    let h='';
    cong.forEach((e,i)=>{
        if(e.t==='pres'){
            const p=pres[e.pid];
            h+='<div class="ent pres'+(emPrevia(e.pid)?' prev':'')+(selId===e.pid?' sel':'')+'" data-idx="'+i+'" onclick="sel(\''+e.pid+'\',\'pres\')">' +
               '<span class="drag-handle">&#10495;</span>' +
               '<span class="et">'+esc(p.titulo)+(emPrevia(e.pid)?' <span class="badge-prev">PRÉVIA</span>':'')+'</span>' +
               '<button class="bi rm" onclick="event.stopPropagation();rmPres(\''+e.pid+'\')">&#10005;</button></div>';
        } else if(e.t==='sep'){
            h+='<div class="ent sep'+(selId===e.sid?' sel':'')+'" data-idx="'+i+'" onclick="sel(\''+e.sid+'\',\'sep\')">' +
               '<span class="drag-handle">&#10495;</span>' +
               '<span class="et">'+esc(sepLabel(e.sid))+'</span>' +
               '<button class="bi rm" onclick="event.stopPropagation();rmSep(\''+e.sid+'\')" title="Remover separador">&#10005;</button></div>';
        } else {
            const it=getItem(e.iid); if(!it) return;
            const vt=votavel(it);
            const cls = it.cAtv.length===0?'sem-com': vt?'votavel':'nvotavel';
            const r=(it.cAtv.length>0&&it.apregoado)?calcRes(it):'';
            const resBadge = r==='ok'?'<span class="badge-res ok" title="Aprovado">&#10003;</span>':r==='no'?'<span class="badge-res no" title="Rejeitado">&#10007;</span>':r==='pe'?'<span class="badge-res pe" title="Apregoado, pendente">&#9680;</span>':'';
            h+='<div class="ent '+cls+(selId===e.iid?' sel':'')+'" data-idx="'+i+'" onclick="sel(\''+e.iid+'\',\'item\')">' +
               '<span class="drag-handle">&#10495;</span>' +
               resBadge +
               '<span class="et">'+esc(it.tit)+'</span>' +

// ---- Navegação prev/next no congresso ----
function getCongNav(id) {
    const idx = congIdx(id);
    if (idx < 0) return { prev:null, next:null };
    const prev = idx > 0 ? cong[idx-1] : null;
    const next = idx < cong.length-1 ? cong[idx+1] : null;
    return { prev, next };
}
function congEntryLabel(e) {
    if (e.t==='pres') { const p=pres[e.pid]; return p ? p.titulo : '?'; }
    if (e.t==='sep') return sepLabel(e.sid);
    const it=getItem(e.iid); return it ? it.tit : '?';
}
function congEntryId(e) { return e.t==='pres' ? e.pid : e.t==='sep' ? e.sid : e.iid; }
function congEntryType(e) { return e.t==='pres' ? 'pres' : e.t==='sep' ? 'sep' : 'item'; }

function renderNavBar(id) {
    const nav = getCongNav(id);
    let h = '<div class="nav-bar">';
    if (nav.prev) {
        h += '<button class="nav-btn prev" onclick="sel(\''+congEntryId(nav.prev)+'\',\''+congEntryType(nav.prev)+'\')">' +
             '<span class="nav-arrow">&#8592;</span><span class="nav-label">'+esc(congEntryLabel(nav.prev))+'</span></button>';
    } else {
        h += '<button class="nav-btn prev" disabled><span class="nav-arrow">&#8592;</span><span class="nav-label">Início</span></button>';
    }
    if (nav.next) {
        h += '<button class="nav-btn next" onclick="sel(\''+congEntryId(nav.next)+'\',\''+congEntryType(nav.next)+'\')">' +
             '<span class="nav-label">'+esc(congEntryLabel(nav.next))+'</span><span class="nav-arrow">&#8594;</span></button>';
    } else {
        h += '<button class="nav-btn next" disabled><span class="nav-label">Fim</span><span class="nav-arrow">&#8594;</span></button>';
    }
    h += '</div>';
    return h;
}

// Barra de quórum: uma casa por membro. Cheias = presentes; as que faltam para o quórum
// ficam vazadas; a casa mais alta é a cadeira-chave (a que completa o quórum).
function qbarHtml(n, total) {
    if(!total) return '';
    const q=Math.floor(total/2)+1;
    let h='<span class="qbar'+(n>=q?' ok':'')+'" title="'+n+' de '+total+' presentes; quórum: '+q+'">';
    for(let i=1;i<=total;i++) h+='<i class="'+(i<=n?'on':i<=q?'falta':'')+(i===q?' key':'')+'"></i>';
    return h+'</span>';
}

let mxRolar=false;   // rolar até a linha selecionada no próximo render (só quando a seleção muda pelo teclado)
// Clique: só troca o destaque (sem refazer a tabela, para o duplo clique continuar valendo)
function mxSel(id) {
    selId=id; save();
    renderCong(); renderItens(); renderComsTab();
    document.querySelectorAll('.mx tr.sel').forEach(tr=>tr.classList.remove('sel'));
    const tr=document.querySelector('.mx tr[data-mx="'+id+'"]'); if(tr) tr.classList.add('sel');

// ↑↓ andam pelos itens (pulando presenças e separadores); Espaço apregoa; Enter abre
function mxTecla(e) {
    if(visao!=='mx' || e.ctrlKey || e.altKey || e.metaKey) return;
    if(document.querySelector('.modal.show')) return;
    const tg=e.target, tag=tg&&tg.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
    const k=e.key;
    if(k!=='ArrowDown'&&k!=='ArrowUp'&&k!==' '&&k!=='Enter') return;
    const its=cong.filter(x=>x.t==='item').map(x=>x.iid);
    if(!its.length) return;
    e.preventDefault();
    if(tag==='BUTTON') tg.blur();   // senão o Espaço/Enter também "clicaria" o botão em foco
    if(k==='ArrowDown'||k==='ArrowUp'){
        const dir=k==='ArrowDown'?1:-1;
        const pos=congIdx(selId);
        let novo;
        if(pos<0) novo=dir>0?its[0]:its[its.length-1];
        else {
            novo=selId;
            for(let i=pos+dir;i>=0&&i<cong.length;i+=dir){ if(cong[i].t==='item'){ novo=cong[i].iid; break; } }
            if(novo===selId && cong[pos].t!=='item') novo=dir>0?its[its.length-1]:its[0];
        }
        selId=novo; mxRolar=true; save(); render();
        return;
    }
    const it=getItem(selId);
    if(!it || !isSel(it.id)) return;
    if(k===' ') togApregoado(it.id);
    else sel(it.id,'item');
}

// Onde mais o vereador já deu presença: em outra comissão deste registro (está na casa agora),
// ou em outro registro/congresso. Usado no dropdown de substituições.
function presencaInfo(p, nome) {
    const convP=getConvocadas(p.id);   // só as comissões convocadas (as outras nem aparecem no registro)
    const aqui=coms.filter(c=>convP.has(c.sigla) && (p.pr[c.sigla]||[]).includes(nome)).map(c=>c.sigla);
    if(aqui.length) return { ord:0, txt:'✓ presente ('+aqui.join(', ')+')' };
    if((p.vistos||[]).includes(nome)) return { ord:0, txt:'✓ visto no plenário' };
    const ip=congIdx(p.id);
    const segP=ip>-1?segDe(ip)[0]:-1;
    const onde=[];
    cong.forEach((e,i)=>{
        if(e.t!=='pres'||e.pid===p.id) return;
        const o=pres[e.pid];
        if(!o||!Object.values(o.pr).some(l=>l.includes(nome))) return;
        const lb = segDe(i)[0]===segP ? 'Presença #'+o.num : nomeCong(i);
        if(!onde.includes(lb)) onde.push(lb);
    });
    if(onde.length) return { ord:1, txt:'deu presença em: '+onde.join(', ') };
    return { ord:2, txt:'' };
}

// Opções do dropdown de substituição, em dois grupos: quem é membro de outra comissão
// convocada neste Congresso (vai ser necessário lá também) e os demais.
// Dentro de cada grupo, quem já deu presença vem primeiro.
function swapOptsHtml(p, c, trocas, conv) {
    const lst=trocas.map(t=>({
        t, inf:presencaInfo(p,t),
        outras:coms.filter(o=>o!==c && conv.has(o.sigla) && o.membros.includes(t)).map(o=>o.sigla)
    })).sort((x,y)=>x.inf.ord-y.inf.ord);
    const opt=o=>'<option value="'+ea(o.t)+'">'+esc(o.t+(o.outras.length?' — membro: '+o.outras.join(', '):'')+(o.inf.txt?' — '+o.inf.txt:''))+'</option>';
    const em=lst.filter(o=>o.outras.length), fora=lst.filter(o=>!o.outras.length);
    if(!em.length) return fora.map(opt).join('');
    return '<optgroup label="Em outra comissão deste Congresso">'+em.map(opt).join('')+'</optgroup>' +
           (fora.length?'<optgroup label="Demais">'+fora.map(opt).join('')+'</optgroup>':'');
}

        const qOk=pr.length>=q;
        let stCls='';
        if(at&&it.apregoado){ const rvc=resComissao(it,c.sigla,pr); stCls=rvc.res==='ok'?' st-ok':rvc.res==='no'?' st-no':' st-pe'; }

        h+='<div class="cc '+(at?'ativo':'off')+stCls+'"><div class="cch" title="'+ea(c.nome)+'">' +
           '<label><input type="checkbox" '+(at?'checked':'')+' onchange="togCom(\''+it.id+'\',\''+c.sigla+'\')"> '+
           c.sigla+' <span class="cnm">'+esc(c.nome)+'</span></label>' +
           qbarHtml(pr.length,c.membros.length) +
           '<span class="qb '+(qOk?'qok':'qno')+'">'+pr.length+'/'+c.membros.length+(qOk?'':' · falta '+(q-pr.length))+'</span>' +
           '</div>';

        if(at){
            h+='<div class="ccb"><div class="mv">';
            if(it.apregoado){
                c.membros.forEach((m,mi)=>{
                    const presente=pr.includes(m);
                    const v=(it.votos[c.sigla]&&it.votos[c.sigla][m])||(it.nominal?'nada':'sim');
                    if(presente){
                        const vc=v==='sim'?'sim':v==='nao'?'nao':v==='abst'?'abst':'nada';
                        const vl=v==='sim'?'S':v==='nao'?'N':v==='abst'?'A':'·';
                        h+='<div class="mr"><button class="vb '+vc+'" onclick="togVoto(\''+it.id+'\',\''+c.sigla+'\','+ci+','+mi+')">'+vl+'</button> '+cargoBadge(c,m)+esc(m)+'</div>';
                    } else {
                        h+='<div class="mr ausente"><span class="vb">—</span> '+cargoBadge(c,m)+esc(m)+'</div>';
                    }
                });
                h+='</div>';
                // resultado comissão
                const rv=resComissao(it,c.sigla,pr);
                const rl=rv.res==='ok'?' — Favorável':rv.res==='no'?' — Contrário':rv.tot>0?' — Pendente':' — Sem presentes';
                h+='<div style="margin-top:6px;font-size:12px">'+rv.sim+'S / '+rv.nao+'N / '+rv.abst+'A'+(it.nominal?' / '+rv.nada+'·':'')+' (maioria: '+rv.maioria+')'+rl+'</div>';
            } else {
                c.membros.forEach(m=>{
                    const presente=pr.includes(m);
                    h+='<div class="mr'+(presente?'':' ausente')+'"><span class="vb">—</span> '+cargoBadge(c,m)+esc(m)+'</div>';
                });
                h+='</div>';
                h+='<div style="margin-top:6px;font-size:12px;color:var(--txt2)">Aguardando apregoação</div>';
            }
            h+='</div>';
        }
        h+='</div>';
    });
    h = hAntes + (h ? '<div class="cgrid">'+h+'</div>' : '<p class="hint">Nenhuma comissão marcada para este item.</p>') +
        (hOff ? '<div class="cc-offs"><span>'+(it.cAtv.length?'Não participam:':'Marque as que dão parecer:')+'</span>'+hOff+'</div>' : '');

    // Resultado geral
    if(it.cAtv.length>0){
        if(it.apregoado){
            const r=calcRes(it);
            let fav=0, con=0, pend=0;
            it.cAtv.forEach(s=>{
                const pr=ef[s]||[];
                const rv=resComissao(it,s,pr);
                if(rv.res==='ok') fav++; else if(rv.res==='no') con++; else pend++;
            });
            h+='<div class="res"><h3>Resultado</h3><p>Favoráveis: '+fav+' | Contrárias: '+con+' | Pendentes: '+pend+' | Total: '+it.cAtv.length+'</p>' +
               '<p class="rs '+(r==='ok'?'ok':r==='no'?'no':'pe')+'">'+(r==='ok'?'APROVADO':r==='no'?'REJEITADO':'PENDENTE')+'</p></div>';
        } else {
            h+='<div class="res"><h3>Resultado</h3><p style="color:var(--txt2)">Item ainda não foi apregoado</p></div>';
        }
    }
    h+='</div>';
    el.innerHTML=h;
    svBind(it);
}

// ========== VOTAÇÃO SIMBÓLICA ==========
// Normaliza para busca (minúsculas, sem acentos)
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

// Modos de voto disponíveis na barra conforme o tipo de votação do item
function svModos(it){ return it.nominal ? ['sim','nao','abst'] : ['nao','abst']; }
function svVotoLabel(v){ return v==='sim'?'Favorável':v==='nao'?'Contrário':v==='abst'?'Abstenção':'—'; }
function svVotoCls(v){ return v==='sim'?'fav':v==='nao'?'contra':v==='abst'?'abst':'nada'; }
function svCycle(it, dir){
    const modos=svModos(it);
    let i=modos.indexOf(svVoto); if(i<0) i=0;
    svVoto=modos[(i+dir+modos.length)%modos.length];
}

// Lista única de todos os vereadores (união dos membros de todas as comissões)
function vereadoresTodos(){
    const map=new Map();
    coms.forEach(c=>c.membros.forEach(m=>{ if(!map.has(m)) map.set(m,{nome:m}); }));
    return [...map.values()];
}

// Comissões ATIVAS do item das quais o vereador é membro
function vereadorComsAtivas(it, nome){
    return it.cAtv.filter(s=>{ const c=coms.find(c=>c.sigla===s); return c && c.membros.includes(nome); });
}

// Referência ao mapa de presença efetiva do item (ou null se não houver presença antes)
function presEfRef(iid){
    const idx=cong.findIndex(e=>e.t==='item'&&e.iid===iid);
    if(idx<0) return null;
    const p=presAntes(idx);
    return p ? p.pr : null;
}

// Garante que o vereador conste como presente na comissão (para o voto contar no placar)
function svMarcarPresente(it, sigla, nome){
    const pr=presEfRef(it.id);
    if(!pr) return;
    if(!pr[sigla]) pr[sigla]=[];
    if(!pr[sigla].includes(nome)) pr[sigla].push(nome);
}

// Sugestões filtradas e ordenadas (membros das comissões do item primeiro)
function svFiltrar(it){
    const q=norm(svQuery.trim());
    if(!q) return [];
    let list=vereadoresTodos().filter(v=>norm(v.nome).includes(q)).map(v=>{
        const comsAtivas=vereadorComsAtivas(it, v.nome);
        return { nome:v.nome, inCom:comsAtivas.length>0, comsAtivas };
    });
    list.sort((a,b)=> (b.inCom - a.inCom) || a.nome.localeCompare(b.nome,'pt'));
    return list.slice(0, 8);
}

// HTML da seção (barra + lista de manifestações)
function svSecaoHtml(it){
    if(!it.declaracoes) it.declaracoes=[];
    if(!svModos(it).includes(svVoto)) svVoto=svModos(it)[0];
    const decl=it.declaracoes;
    let h='<div class="sv">';
    const svHint = it.nominal
        ? '(votação nominal — cada presente vota expressamente; sem manifestação = voto nenhum)'
        : '(favoráveis presumidos — registre só contrários e abstenções)';
    h+='<h3>'+(it.nominal?'Votação nominal':'Votação simbólica')+' <span class="sv-hint">'+svHint+'</span></h3>';
    h+='<div class="sv-bar">' +
       '<input id="sv-input" class="sv-input" type="text" autocomplete="off" spellcheck="false" placeholder="Digite o nome do vereador e tecle Enter…">' +
       '<span id="sv-mode" class="sv-mode '+svVotoCls(svVoto)+'" title="Tocar para alternar">' +
       '<span class="sv-mode-lbl">'+svVotoLabel(svVoto)+'</span><span class="sv-caret">&#9660;</span></span>' +
       '<div id="sv-sug" class="sv-sug"></div>' +
       '</div>';
    h+='<p class="sv-keys">&#8593;&#8595; escolher &middot; &#8592;&#8594; alterna '+svModos(it).map(svVotoLabel).join('/')+' &middot; Enter ou Espaço confirma</p>' +
       '<p class="sv-keys">Barra vazia: Espaço '+(it.apregoado?'desmarca':'marca')+' apregoado &middot; &#8593;&#8595; troca de item</p>';
    if(decl.length){
        h+='<div class="sv-list">';
        decl.forEach((d,i)=>{
            const cls=svVotoCls(d.voto);
            const lbl=svVotoLabel(d.voto);
            const fora=vereadorComsAtivas(it, d.vereador).length===0;
            h+='<div class="sv-li">' +
               '<span class="sv-seq">'+(i+1)+'</span>' +
               '<span class="sv-badge '+cls+'">'+lbl+'</span>' +
               '<span class="sv-nome">'+esc(d.vereador)+(fora?' <span class="sv-fora">fora das comissões</span>':'')+'</span>' +
               (d.digitado&&d.digitado!==d.vereador?'<span class="sv-dig">"'+esc(d.digitado)+'"</span>':'') +
               '<button class="sv-rm" onclick="svRemove(getItem(\''+it.id+'\'),'+i+')" title="Remover">&#10005;</button>' +
               '</div>';
        });
        h+='</div>';
    } else {
        h+='<p class="sv-empty">Nenhuma manifestação registrada ainda.</p>';
    }
    h+='</div>';
    return h;
}

// Renderiza só a caixa de sugestões e o indicador de voto (sem reconstruir o detalhe)
function svRenderSug(it){
    const mode=document.getElementById('sv-mode');
    if(mode){
        const lbl=mode.querySelector('.sv-mode-lbl');
        if(lbl) lbl.textContent=svVotoLabel(svVoto);
        mode.className='sv-mode '+svVotoCls(svVoto);
    }
    const box=document.getElementById('sv-sug');
    if(!box) return;
    const sug=svFiltrar(it);
    if(svActive>=sug.length) svActive=Math.max(0, sug.length-1);
    if(!sug.length){ box.innerHTML=''; box.classList.remove('show'); return; }
    box.classList.add('show');
    box.innerHTML=sug.map((s,i)=>
        '<div class="sv-sug-item'+(s.inCom?' incom':'')+(i===svActive?' active':'')+'" data-sv-idx="'+i+'">' +
        '<span class="sv-sug-nome">'+esc(s.nome)+'</span>' +
        (s.inCom?'<span class="sv-sug-tag">'+esc(s.comsAtivas.join(', '))+'</span>':'') +
        '</div>'
    ).join('');
}

// Liga eventos do input (sem disparar render global ao digitar, para não perder o foco)
function svBind(it){
    const inp=document.getElementById('sv-input');
    if(!inp) return;
    inp.value=svQuery;
    inp.oninput=e=>{ svQuery=e.target.value; svActive=0; svRenderSug(it); };
    inp.onkeydown=e=>{
        // Barra vazia: atalhos de operação por teclado
        if(svQuery.trim()===''){
            if(e.key===' '){ e.preventDefault(); svFocus=true; togApregoado(it.id); return; }
            if(e.key==='ArrowDown'){ e.preventDefault(); navItemTeclado(it, 1); return; }
            if(e.key==='ArrowUp'){ e.preventDefault(); navItemTeclado(it, -1); return; }
        }
        const sug=svFiltrar(it);
        if(e.key==='ArrowDown'){ e.preventDefault(); if(sug.length){ svActive=(svActive+1)%sug.length; svRenderSug(it); } }
        else if(e.key==='ArrowUp'){ e.preventDefault(); if(sug.length){ svActive=(svActive-1+sug.length)%sug.length; svRenderSug(it); } }
        else if(e.key==='ArrowLeft'){ e.preventDefault(); svCycle(it,-1); svRenderSug(it); }
        else if(e.key==='ArrowRight'){ e.preventDefault(); svCycle(it,1); svRenderSug(it); }
        else if(e.key==='Enter'){ e.preventDefault(); if(sug.length){ svConfirm(it, sug[Math.min(svActive, sug.length-1)]); } }
        // Espaço também aceita a sugestão selecionada (mais rápido). Só quando há
        // sugestões; sem sugestões, o espaço é digitado normalmente para refinar a busca.
        else if(e.key===' ' && sug.length){ e.preventDefault(); svConfirm(it, sug[Math.min(svActive, sug.length-1)]); }
        else if(e.key==='Escape'){ e.preventDefault(); svQuery=''; e.target.value=''; svActive=0; svRenderSug(it); }
    };
    const box=document.getElementById('sv-sug');
    if(box){ box.onmousedown=e=>{ const el=e.target.closest('[data-sv-idx]'); if(!el) return; e.preventDefault(); const sug=svFiltrar(it); const i=parseInt(el.dataset.svIdx); if(sug[i]) svConfirm(it, sug[i]); }; }
    const mode=document.getElementById('sv-mode');
    if(mode){ mode.onmousedown=e=>{ e.preventDefault(); svCycle(it,1); svRenderSug(it); const i=document.getElementById('sv-input'); if(i) i.focus(); }; }
    svRenderSug(it);
    if(svFocus){ svFocus=false; inp.focus(); }
}

// Confirma uma manifestação
function svConfirm(it, sug){
    if(!it.declaracoes) it.declaracoes=[];
    it.declaracoes.push({ digitado:svQuery.trim(), vereador:sug.nome, voto:svVoto });
    // integra com o placar das comissões ativas das quais o vereador é membro
    sug.comsAtivas.forEach(s=>{
        if(!it.votos[s]) it.votos[s]={};
        it.votos[s][sug.nome]=svVoto;
        svMarcarPresente(it, s, sug.nome);
    });
    svQuery=''; svActive=0; svVoto=svModos(it)[0];   // volta ao padrão (Favorável se nominal, senão Contrário)
    svFocus=true;
    save(); render();
}

// Remove uma manifestação da lista (e reverte o voto na comissão, se for o caso)
function svRemove(it, idx){
    if(!it||!it.declaracoes) return;
    const d=it.declaracoes[idx];
    if(!d) return;
    it.declaracoes.splice(idx,1);
    const aindaDeclarado=it.declaracoes.some(x=>x.vereador===d.vereador);
    if(!aindaDeclarado){
        vereadorComsAtivas(it, d.vereador).forEach(s=>{
            if(it.votos[s] && it.votos[s][d.vereador]!=null) delete it.votos[s][d.vereador];
        });
    }
    svFocus=true;
    save(); render();
}

// ========== CARGOS E TROCAS ==========
// Badge de presidente/vice de uma comissão (c.pres / c.vice guardam o nome completo)
function cargoBadge(c, m){
    if(c.pres===m) return '<span class="cargo p" title="Presidente">P</span> ';
    if(c.vice===m) return '<span class="cargo v" title="Vice-presidente">V</span> ';
    return '';
}

// Partido de um nome "Fulano (PARTIDO)" (ignora sufixos como [LICENÇA até ...])
function partidoDe(nome){
    const a=nome.lastIndexOf('('), b=nome.indexOf(')', a);
    if(a<0||b<0) return '';
    return nome.substring(a+1,b).trim();
}

// Colegas do mesmo partido (entre todos os vereadores conhecidos) que não estão na comissão
function trocasPossiveis(c, nome){
    const p=partidoDe(nome); if(!p) return [];
    return vereadoresTodos().map(v=>v.nome)
        .filter(n=>n!==nome && partidoDe(n)===p && !c.membros.includes(n))
        .sort((a,b)=>a.localeCompare(b,'pt'));
}

// Troca um membro da comissão por um colega do mesmo partido (para viabilizar quorum).
// A troca vale daqui para a frente: muda a composição, marca o novo como presente no
// registro de presença atual e anota a troca nas Anotações. Presenças e votos anteriores
// ficam como estavam (história não é reescrita). Cargo de presidente/vice não acompanha.
function swapMem(pid, ci, mi, novo){
    if(!novo) return;
    const c=coms[ci]; const ant=c.membros[mi]; const sig=c.sigla;
    const pv=emPrevia(pid);   // na prévia a troca é de teste: sem confirmação e sem anotar (desfaz-se com um clique)
    if(!pv && !confirm('Trocar '+ant+' por '+novo+' na '+sig+'?')){ render(); return; }
    if(pv) previa.trocas.push({ sig, ant, novo, antPres:!!(pres[pid].pr[sig]||[]).includes(ant), cP:c.pres===ant, cV:c.vice===ant });
    c.membros[mi]=novo;
    if(c.pres===ant) c.pres=null;
    if(c.vice===ant) c.vice=null;
    const p=pres[pid];
    if(p){
        if(!p.pr[sig]) p.pr[sig]=[];
        const i=p.pr[sig].indexOf(ant);
        if(i>-1) p.pr[sig].splice(i,1);
        if(!p.pr[sig].includes(novo)) p.pr[sig].push(novo);
    }
    if(!pv) anotarTroca(sig, ant, novo);
    save(); render();
}
function anotarTroca(sig, ant, novo){
    const d=new Date();
    const hora=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    notas=(notas?notas+'\n':'')+'Troca '+sig+' ('+hora+'): '+ant+' → '+novo;
}

// ========== PRÉVIA DE PRESENÇAS ==========
// Antes de abrir o Congresso: marcar quem já chegou e testar substituições num registro de
// presença, podendo depois descartar tudo, ficar só com as presenças ou valer tudo.
// Guarda o registro como estava ao começar e a lista das trocas feitas (para desfazê-las).
function emPrevia(pid){ return !!previa && previa.pid===pid; }
function previaIniciar(pid){
    const p=pres[pid]; if(!p) return;
    if(previa && pres[previa.pid]) return;
    previa={ pid, pr:JSON.parse(JSON.stringify(p.pr||{})), herd:JSON.parse(JSON.stringify(p.herd||{})), trocas:[] };
    save(); render();
}
// Desfaz uma troca de teste: o titular volta à comissão (com o cargo e a presença que tinha)
function previaReverter(t){
    const c=coms.find(x=>x.sigla===t.sig); if(!c) return false;
    const mi=c.membros.indexOf(t.novo); if(mi<0) return false;
    c.membros[mi]=t.ant;
    if(t.cP && !c.pres) c.pres=t.ant;
    if(t.cV && !c.vice) c.vice=t.ant;
    const p=pres[previa.pid];
    if(p){
        const l=(p.pr[t.sig]||[]).filter(n=>n!==t.novo);
        if(t.antPres && !l.includes(t.ant)) l.push(t.ant);
        p.pr[t.sig]=l;
    }
    return true;
}
function previaPodeDesfazer(t){ const c=coms.find(x=>x.sigla===t.sig); return !!c && c.membros.includes(t.novo); }
function previaDesfazTroca(i){
    if(!previa) return;
    const t=previa.trocas[i];
    if(t && previaReverter(t)) previa.trocas.splice(i,1);
    save(); render();
}
function previaDesfazTrocas(){ for(let i=previa.trocas.length-1;i>=0;i--) previaReverter(previa.trocas[i]); }
// modo: 'descartar' (volta ao que era) | 'pres' (ficam as presenças, saem as trocas) | 'tudo' (vale tudo)
function previaEncerrar(modo){
    if(!previa) return;
    const p=pres[previa.pid];
    if(modo==='tudo') previa.trocas.forEach(t=>{ if(previaPodeDesfazer(t)) anotarTroca(t.sig, t.ant, t.novo); });
    else {
        previaDesfazTrocas();
        if(modo==='descartar' && p){ p.pr=previa.pr; p.herd=previa.herd; }   // os vistos ficam: quem foi visto na casa continua visto
    }
    previa=null;
    save(); render();
}
function previaBoxHtml(p){
    if(!emPrevia(p.id)){
        const outra=previa && pres[previa.pid];
        return '<div class="pa"><button class="bt-prev" '+(outra?'disabled title="Já há uma prévia em andamento em '+ea(pres[previa.pid].titulo)+'"':'title="Marcar quem já chegou e testar substituições sem compromisso: dá para descartar tudo depois"')+
               ' onclick="previaIniciar(\''+p.id+'\')">&#9998; Fazer prévia das presenças</button></div>';
    }
    let h='<div class="prev-box"><b>Prévia em andamento.</b> Marque quem você já vê e teste substituições à vontade: as trocas feitas aqui não pedem confirmação nem vão para as Anotações. Enquanto a prévia durar, os itens abaixo deste registro contam o quórum com estas marcações.';
    if(previa.trocas.length){
        h+='<div class="prev-tr">Substituições em teste:';
        previa.trocas.forEach((t,i)=>{
            h+='<div><span>'+t.sig+': '+esc(t.ant)+' &rarr; '+esc(t.novo)+'</span>'+
               (previaPodeDesfazer(t)?'<button onclick="previaDesfazTroca('+i+')">desfazer</button>':'')+'</div>';
        });
        h+='</div>';
    }
    h+=previaSugestoesHtml(p);
    const temTr=previa.trocas.length>0;
    h+='<div class="prev-ac">' +
       '<button onclick="previaEncerrar(\'descartar\')" title="As presenças e as comissões voltam a ser como eram antes da prévia; os vistos no plenário continuam marcados">Descartar a prévia</button>' +
       (temTr?'<button onclick="previaEncerrar(\'pres\')" title="Ficam marcados os presentes; as substituições em teste são desfeitas">Valer só as presenças</button>':'') +
       '<button class="pri" onclick="previaEncerrar(\'tudo\')" title="'+(temTr?'Presenças e substituições passam a valer; as trocas são anotadas nas Anotações':'As presenças marcadas passam a valer')+'">'+(temTr?'Valer tudo (presenças e trocas)':'Valer como presença real')+'</button>' +
       '</div></div>';
    return h;
}
// ---- Vistos no plenário: vereadores que não são membros das comissões convocadas, mas estão
// na casa e por isso servem de substitutos. Ficam em p.vistos (lista de nomes) do registro.
function foraDasConvocadas(conv){
    const dentro=new Set();
    coms.forEach(c=>{ if(conv.has(c.sigla)) c.membros.forEach(m=>dentro.add(m)); });
    return vereadoresTodos().map(v=>v.nome).filter(n=>!dentro.has(n));
}
// Está na casa: marcado presente em alguma comissão deste registro ou marcado como visto
function vistoAqui(p, nome){
    const conv=getConvocadas(p.id);   // presença em comissão não convocada não aparece na tela: não conta
    return (p.vistos||[]).includes(nome) || coms.some(c=>conv.has(c.sigla) && (p.pr[c.sigla]||[]).includes(nome));
}
function togVisto(pid, nome){
    const p=pres[pid]; if(!p) return;
    if(!p.vistos) p.vistos=[];
    const i=p.vistos.indexOf(nome);
    if(i>-1) p.vistos.splice(i,1); else p.vistos.push(nome);
    save(); render();
}
function limparVistos(pid){
    const p=pres[pid]; if(!p) return;
    p.vistos=[];
    save(); render();
}
function vistosHtml(p, conv, pv){
    if(!conv.size) return '';
    const fora=foraDasConvocadas(conv);
    const marc=(p.vistos||[]).filter(n=>fora.includes(n));
    if(!fora.length) return '';
    const grupos={};

// ========== LÓGICA ==========
function getPresEf(iid) {
    // Presença efetiva: última presença ANTES deste item na ordem do congresso,
    // sem atravessar separador (cada congresso tem a sua presença)
    const idx=cong.findIndex(e=>e.t==='item'&&e.iid===iid);
    if(idx<0) return {};
    const p=presAntes(idx);
    return p ? p.pr : {};
}

function resComissao(it, sigla, presentes) {
    const def = it.nominal ? 'nada' : 'sim';
    let sim=0, nao=0, abst=0, nada=0;
    presentes.forEach(m=>{
        const v=(it.votos[sigla]&&it.votos[sigla][m])||def;
        if(v==='sim') sim++; else if(v==='nao') nao++; else if(v==='abst') abst++; else nada++;
    });
    const c=coms.find(c=>c.sigla===sigla);
    const total=c?c.membros.length:0;
    const maioria=Math.floor(total/2)+1;
    const res=sim>=maioria?'ok':nao>=maioria?'no':'pe';
    return { sim, nao, abst, nada, tot:presentes.length, total, maioria, res };
}

function calcRes(it) {
    if(it.cAtv.length===0||!it.apregoado) return 'pe';
    const ef=getPresEf(it.id);
    let fav=0, con=0;
    it.cAtv.forEach(s=>{
        const pr=ef[s]||[];
        const rv=resComissao(it,s,pr);
        if(rv.res==='ok') fav++; else if(rv.res==='no') con++;
    });
    if(fav>it.cAtv.length/2) return 'ok';
    if(con>it.cAtv.length/2) return 'no';
    return 'pe';
}

function votavel(it) {
    if(it.cAtv.length===0) return false;
    const ef=getPresEf(it.id);
    let cq=0;
    it.cAtv.forEach(s=>{
        const c=coms.find(c=>c.sigla===s);
        if(!c) return;
        const pr=ef[s]||[];
        if(pr.length>=Math.floor(c.membros.length/2)+1) cq++;
    });
    return cq>it.cAtv.length/2;
}

// Comissões convocadas. Com id (de uma entrada do congresso), só as do congresso
// (trecho entre separadores) a que a entrada pertence; sem id, de toda a lista.
function getConvocadas(id) {
    let a=0, b=cong.length;
    if(id!=null){ const i=congIdx(id); if(i>-1){ const sg=segDe(i); a=sg[0]; b=sg[1]; } }
    const s=new Set();
    for(let i=a;i<b;i++){
        const e=cong[i];
        if(e.t==='item'){ const it=getItem(e.iid); if(it) it.cAtv.forEach(c=>s.add(c)); }
    }
    return s;
}

// ========== IMPORTAR / EXPORTAR TEXTO ==========
function exportState() {
    let txt = '=== COMISSÕES ===\n\n';
    txt += coms.map(c =>
        c.sigla + ' | ' + c.nome + '\n' + c.membros.map(m =>
            m + (c.pres === m ? ' [PRESIDENTE]' : c.vice === m ? ' [VICE]' : '')
        ).join('\n')
    ).join('\n\n');

    if (cong.length > 0) {
        txt += '\n\n=== CONGRESSO ===';
        cong.forEach(e => {
            txt += '\n\n';
            if (e.t === 'pres') {
                const p = pres[e.pid];
                txt += 'PRESENÇA #' + p.num;
                coms.forEach(c => {
                    const pr = p.pr[c.sigla] || [];
                    if (pr.length > 0) txt += '\n' + c.sigla + ': ' + pr.join('; ');
                });
            } else if (e.t === 'sep') {
                const s = seps[e.sid];
                txt += 'SEPARADOR' + (s && s.titulo ? ' | ' + s.titulo : '');
            } else {
                const it = getItem(e.iid);
                if (!it) return;
                txt += 'ITEM ' + it.num + (it.pe ? ' | PÉ' : '') + (it.apregoado ? ' | APREGOADO' : '') + (it.nominal ? ' | NOMINAL' : '');
                txt += '\nTítulo: ' + it.tit;
                if (it.desc) txt += '\nDescrição: ' + it.desc.replace(/\n/g, ' ');
                if (it.cAtv.length > 0) {
                    txt += '\nComissões: ' + it.cAtv.join(', ');
                    it.cAtv.forEach(s => {
                        const votos = it.votos[s] || {};
                        const parts = Object.entries(votos).filter(([m, v]) => v !== 'nada').map(([m, v]) =>
                            m + '=' + (v === 'sim' ? 'S' : v === 'nao' ? 'N' : 'A')
                        );
                        if (parts.length > 0) txt += '\nVotos ' + s + ': ' + parts.join('; ');
                    });
                }
                if (it.declaracoes && it.declaracoes.length > 0) {
                    txt += '\nManifestações: ' + it.declaracoes.map(d =>
                        d.vereador + '=' + (d.voto === 'nao' ? 'C' : d.voto === 'abst' ? 'A' : 'F')
                    ).join('; ');
                }
            }
        });
    }
    if (notas && notas.trim()) {
        txt = txt.trimEnd() + '\n\n=== ANOTAÇÕES ===\n' + notas.trim();
    }
    return txt.trimEnd();
}

function importState(txt) {
    // Extrair anotações (texto livre) — deve ser a última seção; capturada verbatim
    let notasImport = '';
    const mNotas = txt.match(/\n?===\s*ANOTA[ÇC][ÕO]ES\s*===[ \t]*\n?/i);
    if (mNotas) {
        notasImport = txt.substring(mNotas.index + mNotas[0].length);
        txt = txt.substring(0, mNotas.index);
    }
    // Dividir em linhas e agrupar por seções e blocos
    const lines = txt.split('\n');
    let section = null;
    let block = [];
    const blocks = { com: [], cong: [] };

    for (const line of lines) {
        const trimmed = line.trim();
        if (/^===\s*COMISS[ÕO]ES\s*===$/i.test(trimmed)) {
            if (block.length > 0 && section) blocks[section].push(block);
            section = 'com'; block = []; continue;
        }
        if (/^===\s*CONGRESSO\s*===$/i.test(trimmed)) {
            if (block.length > 0 && section) blocks[section].push(block);
            section = 'cong'; block = []; continue;
        }
        if (section) {
            if (trimmed === '') {
                if (block.length > 0) { blocks[section].push(block); block = []; }
            } else {
                block.push(trimmed);
            }
        }
    }
    if (block.length > 0 && section) blocks[section].push(block);

    // --- Parsear comissões ---
    const newComs = [];
    for (const bl of blocks.com) {
        const cab = bl[0];
        const sep = cab.indexOf('|');
        if (sep < 0) return { ok: false, erro: 'Formato inválido: "' + cab + '". Use: SIGLA | Nome' };
        const sigla = cab.substring(0, sep).trim();
        const nome = cab.substring(sep + 1).trim();
        if (!sigla) return { ok: false, erro: 'Sigla vazia em: "' + cab + '"' };
        const membros = []; let presNome = null, viceNome = null;
        bl.slice(1).filter(l => l).forEach(l => {
            let nome = l.trim();
            // Marcador de cargo no fim da linha: [PRESIDENTE], [VICE], [P], [V],
            // ou "– PRESIDENTE" / "– VICE(-PRESIDENTE)" como no Quadro da Câmara
            let mm = nome.match(/^(.*?)\s*\[\s*(PRESIDENTE|VICE(?:-PRESIDENTE)?|P|V)\s*\]$/i);
            if (!mm) mm = nome.match(/^(.*?)\s*[–\-—]\s*(PRESIDENTE|VICE(?:-PRESIDENTE)?)$/i);
            if (mm) {
                nome = mm[1].trim();
                if (/^v/i.test(mm[2])) viceNome = nome; else presNome = nome;
            }
            membros.push(nome);
        });
        if (membros.length === 0) return { ok: false, erro: 'Comissão "' + sigla + '" sem membros.' };
        newComs.push({ sigla, nome, membros, pres: presNome, vice: viceNome });
    }
    if (newComs.length === 0) return { ok: false, erro: 'Nenhuma comissão encontrada.' };

    // --- Resetar estado ---
    coms = newComs;
    itens = [];
    for (let i = 1; i <= 100; i++) itens.push(mkItem(i));
    cong = [];
    pres = {};
    previa = null;
    seps = {};
    nSep = 1;
    nPres = 2;
    nItem = 101;
    notas = notasImport.replace(/^\n+/, '').trimEnd();

    // --- Parsear congresso ---
    for (const bl of blocks.cong) {
        const header = bl[0];

        // Separador de congressos: "SEPARADOR" ou "SEPARADOR | Título"
        const sepMatch = header.match(/^SEPARADOR(?:\s*\|\s*(.*))?$/i);
        if (sepMatch) {
            const s = { id: 's-' + (nSep++), titulo: (sepMatch[1] || '').trim() };
            seps[s.id] = s;
            cong.push({ t: 'sep', sid: s.id });
            continue;
        }

        // Presença
        const presMatch = header.match(/^PRESEN[CÇ]A\s*#(\d+)$/i);
        if (presMatch) {
            const num = parseInt(presMatch[1]);
            if (num >= nPres) nPres = num + 1;
            const p = mkPres(num);
            for (let i = 1; i < bl.length; i++) {
                const col = bl[i].indexOf(':');
                if (col < 0) continue;
                const sig = bl[i].substring(0, col).trim();
                const membros = bl[i].substring(col + 1).split(';').map(m => m.trim()).filter(m => m);
                p.pr[sig] = membros;
            }
            pres[p.id] = p;
            cong.push({ t: 'pres', pid: p.id });
            continue;
        }

        // Item
        const itemMatch = header.match(/^ITEM\s+(\d+)(.*)$/i);
        if (itemMatch) {
            const num = parseInt(itemMatch[1]);
            const flags = itemMatch[2] || '';
            const pe = /\|\s*P[ÉE]\s*(\||$)/i.test(flags);
            const apregoado = /APREGOADO/i.test(flags);
            const nominal = /NOMINAL/i.test(flags);
            let it = itens.find(x => x.id === 'i-' + num);
            if (!it) {
                it = mkItem(num);
                itens.push(it);
                if (num >= nItem) nItem = num + 1;
            }
            it.pe = pe;
            it.apregoado = apregoado;
            it.nominal = nominal;
            for (let i = 1; i < bl.length; i++) {
                const line = bl[i];
                if (/^T[ií]tulo:/i.test(line)) {
                    it.tit = line.replace(/^T[ií]tulo:\s*/i, '');
                } else if (/^Descri[çc][ãa]o:/i.test(line)) {
                    it.desc = line.replace(/^Descri[çc][ãa]o:\s*/i, '');
                } else if (/^Comiss[õo]es:/i.test(line)) {
                    it.cAtv = line.replace(/^Comiss[õo]es:\s*/i, '').split(',').map(s => s.trim()).filter(s => s);
                } else if (/^Votos\s+/i.test(line)) {
                    const col = line.indexOf(':');
                    const sig = line.substring(6, col).trim();
                    const votosStr = line.substring(col + 1).trim();
                    it.votos[sig] = {};
                    votosStr.split(';').forEach(v => {
                        const eq = v.lastIndexOf('=');
                        if (eq < 0) return;
                        const membro = v.substring(0, eq).trim();
                        const vl = v.substring(eq + 1).trim().toUpperCase();
                        it.votos[sig][membro] = vl === 'S' ? 'sim' : vl === 'N' ? 'nao' : 'abst';
                    });
                } else if (/^Manifesta[çc][õo]es:/i.test(line)) {
                    const val = line.replace(/^Manifesta[çc][õo]es:\s*/i, '');
                    it.declaracoes = val.split(';').map(x => x.trim()).filter(Boolean).map(x => {
                        const eq = x.lastIndexOf('=');
                        if (eq < 0) return null;
                        const vereador = x.substring(0, eq).trim();
                        const vl = x.substring(eq + 1).trim().toUpperCase();
                        const voto = vl === 'A' ? 'abst' : vl === 'F' ? 'sim' : 'nao';
                        return { digitado: vereador, vereador, voto };
                    }).filter(Boolean);
                }
            }
            cong.push({ t: 'item', iid: it.id });
            continue;
        }

        return { ok: false, erro: 'Bloco não reconhecido: "' + header + '"' };
    }

    selId = null;
    save();
    return { ok: true };
}
